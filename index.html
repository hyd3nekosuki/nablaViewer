const MAX_DPR = 2;

/**
 * Tallest the drawing surface is allowed to get, height ÷ width.
 *
 * The scale has to be the same on both axes or circles stop looking like
 * circles, which would wreck the divergence and curl probes.  That means the
 * only way to stop a tall phone from showing a strip of field four times
 * taller than it is wide — squashing the interesting part near the origin —
 * is to stop drawing at some point.  The spare height below goes to the
 * readout bar, so nothing has to sit on top of the picture.
 */
const MAX_ASPECT = 1.4;

class Scene {
  constructor(canvas, { range = 3.2 } = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    this.range = range;

    this.static = document.createElement('canvas');
    this.sctx = this.static.getContext('2d', { alpha: false });

    // Low-resolution buffer for the scalar heat map.
    this.heat = document.createElement('canvas');
    this.hctx = this.heat.getContext('2d', { alpha: false });

    this.w = 0; this.h = 0; this.dpr = 1; this.scale = 1; this.cx = 0; this.cy = 0;
    this.staticDirty = true;
    this.running = false;
    this._raf = 0;
    this._last = 0;

    this._drawStatic = null;
    this._drawFrame = null;
    this._onPointer = null;
    this._onResize = null;

    this._ro = new ResizeObserver(() => this._measure());
    this._ro.observe(canvas.parentElement || canvas);

    this._bindPointer();
    this._onVisibility = () => { if (document.hidden) this.stop(); else if (this._wanted) this.start(); };
    document.addEventListener('visibilitychange', this._onVisibility);

    this._measure();
  }

  /* ------------------------------------------------------------ geometry */

  _measure() {
    const host = this.canvas.parentElement || this.canvas;
    const cssW = Math.max(1, host.clientWidth);
    const cssH = Math.max(1, Math.min(host.clientHeight, cssW * MAX_ASPECT));
    const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    const w = Math.round(cssW * dpr);
    const h = Math.round(cssH * dpr);
    if (w === this.w && h === this.h && dpr === this.dpr) return;

    this.cssW = cssW; this.cssH = cssH; this.dpr = dpr;
    this.w = w; this.h = h;
    this.canvas.width = w; this.canvas.height = h;
    this.canvas.style.width = `${cssW}px`;
    this.canvas.style.height = `${cssH}px`;
    // Chrome anchored to the canvas rather than the stage reads this.
    host.style.setProperty('--cvh', `${cssH}px`);
    this.static.width = w; this.static.height = h;

    // Isotropic: the shorter side spans exactly 2·range, so circles stay circular.
    this.scale = Math.min(w, h) / (2 * this.range);
    this.cx = w / 2;
    this.cy = h / 2;

    // Heat-map buffer: a fraction of the real resolution, smoothed on blit.
    const hw = Math.max(48, Math.min(160, Math.round(w / 8)));
    const hh = Math.max(48, Math.min(160, Math.round(h / 8)));
    this.heat.width = hw; this.heat.height = hh;

    this.staticDirty = true;
    // The visible window just changed, so anything derived from it — colour
    // ranges, contour steps, arrow scaling — has to be recomputed.
    this._onResize?.(this);
    if (!this.running) this._renderOnce();
  }

  /** Half-width of the visible region, in math units. */
  get xHalf() { return this.w / 2 / this.scale; }
  get yHalf() { return this.h / 2 / this.scale; }

  px(x) { return this.cx + x * this.scale; }
  py(y) { return this.cy - y * this.scale; }
  mx(px) { return (px - this.cx) / this.scale; }
  my(py) { return (this.cy - py) / this.scale; }

  /** Math-unit length → device pixels. */
  len(u) { return u * this.scale; }

  /* ------------------------------------------------------------- drawing */

  onStatic(fn) { this._drawStatic = fn; this.staticDirty = true; return this; }
  onFrame(fn) { this._drawFrame = fn; return this; }
  onPointer(fn) { this._onPointer = fn; return this; }
  onResize(fn) { this._onResize = fn; return this; }

  invalidate() { this.staticDirty = true; }

  /**
   * Fill the static layer's background with a scalar field, using the
   * low-resolution buffer.  `norm(x, y)` must return a value in [0,1].
   */
  paintScalar(cmapId, valueAt, lo, hi) {
    const { heat, hctx } = this;
    const hw = heat.width, hh = heat.height;
    const img = hctx.createImageData(hw, hh);
    const data = img.data;
    const table = lut(cmapId);
    const span = hi - lo || 1;
    const xHalf = this.xHalf, yHalf = this.yHalf;

    for (let j = 0; j < hh; j++) {
      // Pixel centres, so the buffer lines up with the blit target.
      const y = yHalf - ((j + 0.5) / hh) * 2 * yHalf;
      for (let i = 0; i < hw; i++) {
        const x = -xHalf + ((i + 0.5) / hw) * 2 * xHalf;
        let tNorm = (valueAt(x, y) - lo) / span;
        tNorm = tNorm < 0 ? 0 : tNorm > 1 ? 1 : tNorm;
        const k = (tNorm * 255 + 0.5) | 0;
        const o = (j * hw + i) * 4;
        const c = k * 3;
        data[o] = table[c]; data[o + 1] = table[c + 1]; data[o + 2] = table[c + 2];
        data[o + 3] = 255;
      }
    }
    hctx.putImageData(img, 0, 0);

    const s = this.sctx;
    s.imageSmoothingEnabled = true;
    s.imageSmoothingQuality = 'high';
    s.drawImage(heat, 0, 0, hw, hh, 0, 0, this.w, this.h);
  }

  /** Axes and a light grid, drawn into the static layer. */
  paintAxes(step = 1, { grid = 'rgba(255,255,255,0.07)', axis = 'rgba(255,255,255,0.30)' } = {}) {
    const s = this.sctx;
    const xHalf = this.xHalf, yHalf = this.yHalf;
    s.lineWidth = Math.max(1, this.dpr * 0.5);
    s.strokeStyle = grid;
    s.beginPath();
    for (let k = -Math.ceil(xHalf / step); k <= Math.ceil(xHalf / step); k++) {
      if (k === 0) continue;
      const p = Math.round(this.px(k * step)) + 0.5;
      s.moveTo(p, 0); s.lineTo(p, this.h);
    }
    for (let k = -Math.ceil(yHalf / step); k <= Math.ceil(yHalf / step); k++) {
      if (k === 0) continue;
      const p = Math.round(this.py(k * step)) + 0.5;
      s.moveTo(0, p); s.lineTo(this.w, p);
    }
    s.stroke();

    s.strokeStyle = axis;
    s.lineWidth = Math.max(1, this.dpr);
    s.beginPath();
    s.moveTo(0, Math.round(this.cy) + 0.5); s.lineTo(this.w, Math.round(this.cy) + 0.5);
    s.moveTo(Math.round(this.cx) + 0.5, 0); s.lineTo(Math.round(this.cx) + 0.5, this.h);
    s.stroke();
  }

  /* --------------------------------------------------------------- loop */

  _renderOnce() {
    if (!this._drawStatic) return;
    this._buildStatic();
    this.ctx.drawImage(this.static, 0, 0);
    if (this._drawFrame) this._drawFrame(this.ctx, this, 0);
  }

  _buildStatic() {
    this.sctx.fillStyle = '#0a0e15';
    this.sctx.fillRect(0, 0, this.w, this.h);
    this._drawStatic(this.sctx, this);
    this.staticDirty = false;
  }

  start() {
    this._wanted = true;
    if (this.running || document.hidden) return;
    this.running = true;
    this._last = performance.now();
    const tick = (now) => {
      if (!this.running) return;
      const dt = Math.min((now - this._last) / 1000, 0.05);
      this._last = now;
      if (this.staticDirty) this._buildStatic();
      this.ctx.drawImage(this.static, 0, 0);
      if (this._drawFrame) this._drawFrame(this.ctx, this, dt);
      this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }

  stop() {
    this.running = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    this._raf = 0;
  }

  destroy() {
    this._wanted = false;
    this.stop();
    this._ro.disconnect();
    document.removeEventListener('visibilitychange', this._onVisibility);
    // Release the backing stores explicitly; mobile Safari is slow to reclaim them.
    this.canvas.width = this.canvas.height = 0;
    this.static.width = this.static.height = 0;
    this.heat.width = this.heat.height = 0;
  }

  /* ------------------------------------------------------------ pointer */

  _bindPointer() {
    const send = (e, phase) => {
      if (!this._onPointer) return;
      const r = this.canvas.getBoundingClientRect();
      const px = (e.clientX - r.left) * (this.w / r.width);
      const py = (e.clientY - r.top) * (this.h / r.height);
      this._onPointer(this.mx(px), this.my(py), phase);
    };
    this.canvas.addEventListener('pointerdown', (e) => {
      this.canvas.setPointerCapture(e.pointerId);
      this._dragging = true;
      send(e, 'down');
      e.preventDefault();
    });
    this.canvas.addEventListener('pointermove', (e) => {
      if (!this._dragging) return;
      send(e, 'move');
      e.preventDefault();
    });
    const end = (e) => {
      if (!this._dragging) return;
      this._dragging = false;
      send(e, 'up');
    };
    this.canvas.addEventListener('pointerup', end);
    this.canvas.addEventListener('pointercancel', end);
  }
}

/* ------------------------------------------------------------- utilities */

/** Arrow with a solid head, in device pixels. */
function arrow(ctx, x0, y0, x1, y1, headLen) {
  const a = Math.atan2(y1 - y0, x1 - x0);
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
  const h = headLen;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - h * Math.cos(a - 0.42), y1 - h * Math.sin(a - 0.42));
  ctx.lineTo(x1 - h * Math.cos(a + 0.42), y1 - h * Math.sin(a + 0.42));
  ctx.closePath();
  ctx.fill();
}

/**
 * Marching squares.  Returns an array of [x0,y0,x1,y1] segments in math
 * coordinates for the level set f = level over the given rectangle.
 */
function contourSegments(f, level, xMin, xMax, yMin, yMax, nx, ny) {
  const segs = [];
  const dx = (xMax - xMin) / nx;
  const dy = (yMax - yMin) / ny;
  // One row of samples is reused by the next, so each point is evaluated once.
  let prev = new Float64Array(nx + 1);
  let cur = new Float64Array(nx + 1);
  for (let i = 0; i <= nx; i++) prev[i] = f(xMin + i * dx, yMin);

  const lerp = (a, b, va, vb) => a + ((level - va) / (vb - va)) * (b - a);

  for (let j = 1; j <= ny; j++) {
    const y1 = yMin + j * dy;
    const y0 = y1 - dy;
    for (let i = 0; i <= nx; i++) cur[i] = f(xMin + i * dx, y1);

    for (let i = 0; i < nx; i++) {
      const x0 = xMin + i * dx;
      const x1 = x0 + dx;
      // Corner values: bl, br, tr, tl (y grows upward).
      const bl = prev[i], br = prev[i + 1], tr = cur[i + 1], tl = cur[i];
      let code = 0;
      if (bl > level) code |= 1;
      if (br > level) code |= 2;
      if (tr > level) code |= 4;
      if (tl > level) code |= 8;
      if (code === 0 || code === 15) continue;

      const B = () => [lerp(x0, x1, bl, br), y0];
      const R = () => [x1, lerp(y0, y1, br, tr)];
      const T = () => [lerp(x0, x1, tl, tr), y1];
      const L = () => [x0, lerp(y0, y1, bl, tl)];

      const push = (p, q) => segs.push(p[0], p[1], q[0], q[1]);

      switch (code) {
        case 1: case 14: push(L(), B()); break;
        case 2: case 13: push(B(), R()); break;
        case 3: case 12: push(L(), R()); break;
        case 4: case 11: push(R(), T()); break;
        case 6: case 9: push(B(), T()); break;
        case 7: case 8: push(L(), T()); break;
        case 5: push(L(), T()); push(B(), R()); break;   // saddle
        case 10: push(L(), B()); push(R(), T()); break;  // saddle
        default: break;
      }
    }
    const swap = prev; prev = cur; cur = swap;
  }
  return segs;
}

  return { Scene, arrow, contourSegments };
})();

/* ===== gradient.js ===== */
NV.gradient = (function () {
/* nablaViewer — gradient.js
 *
 * What changed from the original, and why:
 *
 *  - The colour scale is derived from the formula over the visible window and
 *    is then held fixed.  In the original it was recomputed from the probe's
 *    own height every frame, so simply dragging the probe repainted the whole
 *    field and the colours meant nothing stable.
 *  - A colour bar is always on screen, with numbers on it and a marker at the
 *    probe's height, so "what is this colour telling me" has a literal answer.
 *  - Contours are real marching-squares isolines carrying numeric labels, so
 *    the height can be read without using colour at all.
 *  - The default map is Viridis, whose lightness rises monotonically; the map
 *    is switchable for anyone who prefers another.
 */

const { tryCompile, gradient, fieldRange, niceStep } = NV.field;
const { GRADIENT_PRESETS } = NV.presets;
const { Scene, arrow, contourSegments } = NV.view;
const { cssColor, paintColorbar, inkOn } = NV.colormap;
const { t, pick } = NV.i18n;
const { tex } = NV.tex;
const fmt = (v, d = 2) => (Math.abs(v) < 5e-3 ? '0' : v.toFixed(d));

function createGradient(host, app, initial) {
  let preset = GRADIENT_PRESETS.find((p) => p.id === initial) || GRADIENT_PRESETS[0];
  let formula = preset.f;
  let f = tryCompile(formula).fn;
  let probe = { x: 1.1, y: 0.9 };
  let range = [0, 1];
  let step = 0.5;
  let maxMag = 1;

  // Ball simulation
  let rolling = false;
  const ball = { x: 0, y: 0, vx: 0, vy: 0, path: [] };

  host.innerHTML = `
    <div class="stage">
      <canvas class="cv" aria-label="Gradient field"></canvas>
      <button class="pill pill-top" data-act="field"><b>∇f</b><span class="pill-name"></span><i class="chev"></i></button>
      <div class="cbar" aria-hidden="true">
        <div class="cbar-cap"></div>
        <div class="cbar-body">
          <canvas class="cbar-cv" width="12" height="200"></canvas>
          <div class="cbar-ticks"></div>
          <div class="cbar-mark"><span></span></div>
        </div>
      </div>
      <div class="hud">
        <div class="hud-main"></div>
        <button class="hud-more" data-act="details"></button>
      </div>
      <button class="fab" data-act="roll"></button>
      <div class="sheet-detail" hidden></div>
    </div>`;

  const stage = host.querySelector('.stage');
  const canvas = host.querySelector('.cv');
  const pillName = host.querySelector('.pill-name');
  const cbarCv = host.querySelector('.cbar-cv');
  const cbarCap = host.querySelector('.cbar-cap');
  const cbarTicks = host.querySelector('.cbar-ticks');
  const cbarMark = host.querySelector('.cbar-mark');
  const hudMain = host.querySelector('.hud-main');
  const hudMore = host.querySelector('.hud-more');
  const fab = host.querySelector('.fab');
  const detail = host.querySelector('.sheet-detail');

  const scene = new Scene(canvas, { range: 3.2 });

  /* ------------------------------------------------------------- model */

  function setFormula(src, p) {
    const res = tryCompile(src);
    if (res.error) return res.error;
    formula = src;
    f = res.fn;
    preset = p || { id: 'custom', name: { en: t('ui.customField'), ja: t('ui.customField') }, tex: `f = ${src}`, result: '', hint: { en: '', ja: '' } };
    rolling = false;
    ball.path.length = 0;
    rescale();
    scene.invalidate();
    syncChrome();
    return null;
  }

  /** Fix the colour scale from the formula and the window — not from the probe. */
  function rescale() {
    range = fieldRange((x, y) => f(x, y, 0), -scene.xHalf, scene.xHalf, -scene.yHalf, scene.yHalf, 56);
    step = niceStep(range[1] - range[0], 9);
    maxMag = 1e-6;
    const n = 15;
    for (let j = 0; j <= n; j++) {
      for (let i = 0; i <= n; i++) {
        const x = -scene.xHalf + (2 * scene.xHalf * i) / n;
        const y = -scene.yHalf + (2 * scene.yHalf * j) / n;
        const g = gradient(f, x, y);
        if (g.mag > maxMag && Number.isFinite(g.mag)) maxMag = g.mag;
      }
    }
  }

  const norm = (v) => {
    const u = (v - range[0]) / (range[1] - range[0] || 1);
    return u < 0 ? 0 : u > 1 ? 1 : u;
  };

  /* ------------------------------------------------------- static layer */

  scene.onStatic((s, S) => {
    s.imageSmoothingEnabled = true;
    S.paintScalar(app.colormap, (x, y) => f(x, y, 0), range[0], range[1]);

    // Contours at tidy round values, labelled so colour is never the only cue.
    const first = Math.ceil(range[0] / step) * step;
    const levels = [];
    for (let v = first; v <= range[1] + 1e-9; v += step) levels.push(v);

    const placed = [];
    const minGap = 78 * S.dpr;
    s.lineCap = 'round';

    levels.forEach((level, li) => {
      const segs = contourSegments(
        (x, y) => f(x, y, 0), level,
        -S.xHalf, S.xHalf, -S.yHalf, S.yHalf,
        Math.round(96 * (S.w / Math.max(S.w, S.h))) + 32,
        Math.round(96 * (S.h / Math.max(S.w, S.h))) + 32,
      );
      if (!segs.length) return;

      const dark = inkOn(app.colormap, norm(level)) === '#0b0f16';
      s.strokeStyle = dark ? 'rgba(0,0,0,0.42)' : 'rgba(255,255,255,0.40)';
      s.lineWidth = Math.max(1, S.dpr * 0.9);
      s.beginPath();
      for (let k = 0; k < segs.length; k += 4) {
        s.moveTo(S.px(segs[k]), S.py(segs[k + 1]));
        s.lineTo(S.px(segs[k + 2]), S.py(segs[k + 3]));
      }
      s.stroke();

      // One label per level.  Marching squares emits its segments in scan
      // order, so taking the first acceptable one would pile every label into
      // the same corner.  Aim each level at a target that walks round the view
      // by the golden angle instead, and take the segment nearest to it.
      if (li % 2 !== 0 && levels.length > 5) return;
      const pad = 34 * S.dpr;
      const th = li * 2.399963;
      const rad = Math.min(S.w, S.h) * 0.34;
      const tx = S.w / 2 + Math.cos(th) * rad;
      const ty = S.h / 2 + Math.sin(th) * rad;

      let best = null, bestD = Infinity;
      for (let k = 0; k < segs.length; k += 4) {
        const mx = S.px((segs[k] + segs[k + 2]) / 2);
        const my = S.py((segs[k + 1] + segs[k + 3]) / 2);
        if (mx < pad || mx > S.w - pad || my < pad || my > S.h - pad) continue;
        if (placed.some(([qx, qy]) => Math.hypot(qx - mx, qy - my) < minGap)) continue;
        const d = (mx - tx) * (mx - tx) + (my - ty) * (my - ty);
        if (d < bestD) { bestD = d; best = [mx, my]; }
      }
      if (!best) return;
      placed.push(best);
      label(s, S, best[0], best[1], fmt(level, Math.abs(step) < 0.95 ? 1 : 0), norm(level));
    });

    S.paintAxes(1, { grid: 'rgba(255,255,255,0.055)', axis: 'rgba(255,255,255,0.22)' });

    // The gradient field.  Length is proportional to ‖∇f‖, so a flat region
    // genuinely shows short arrows rather than normalised ones.
    const n = app.density;
    const cell = Math.min(S.w, S.h) / n;
    const maxLen = cell * 0.82;
    s.lineCap = 'round';
    for (let j = 0; j <= n; j++) {
      for (let i = 0; i <= n; i++) {
        const x = -S.xHalf + (2 * S.xHalf * i) / n;
        const y = -S.yHalf + (2 * S.yHalf * j) / n;
        const g = gradient(f, x, y);
        if (!(g.mag > 1e-4)) continue;
        const L = Math.min(maxLen, (g.mag / maxMag) * maxLen);
        if (L < 3 * S.dpr) continue;
        const x0 = S.px(x), y0 = S.py(y);
        const ux = g.fx / g.mag, uy = -g.fy / g.mag;
        const head = Math.max(3 * S.dpr, L * 0.3);
        // Dark halo first so the arrows read on both ends of every colour scale.
        s.strokeStyle = 'rgba(0,0,0,0.55)'; s.fillStyle = 'rgba(0,0,0,0.55)';
        s.lineWidth = 3.2 * S.dpr;
        arrow(s, x0, y0, x0 + ux * L, y0 + uy * L, head);
        s.strokeStyle = '#ffffff'; s.fillStyle = '#ffffff';
        s.lineWidth = 1.4 * S.dpr;
        arrow(s, x0, y0, x0 + ux * L, y0 + uy * L, head * 0.78);
      }
    }
  });

  function label(s, S, x, y, text, tNorm) {
    s.font = `600 ${11 * S.dpr}px ui-sans-serif, system-ui, sans-serif`;
    s.textAlign = 'center';
    s.textBaseline = 'middle';
    const w = s.measureText(text).width + 8 * S.dpr;
    const h = 15 * S.dpr;
    s.fillStyle = 'rgba(10,14,21,0.72)';
    s.beginPath();
    if (s.roundRect) s.roundRect(x - w / 2, y - h / 2, w, h, 4 * S.dpr);
    else s.rect(x - w / 2, y - h / 2, w, h);
    s.fill();
    s.fillStyle = inkOn(app.colormap, tNorm) === '#0b0f16' ? '#e8eef7' : '#e8eef7';
    s.fillText(text, x, y);
  }

  /* -------------------------------------------------------- frame layer */

  scene.onFrame((c, S, dt) => {
    if (rolling) stepBall(dt);

    // Downhill trail
    if (ball.path.length > 1) {
      c.strokeStyle = 'rgba(255,255,255,0.75)';
      c.lineWidth = 2 * S.dpr;
      c.setLineDash([5 * S.dpr, 5 * S.dpr]);
      c.beginPath();
      for (let i = 0; i < ball.path.length; i += 2) {
        const px = S.px(ball.path[i]), py = S.py(ball.path[i + 1]);
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.stroke();
      c.setLineDash([]);
    }

    const g = gradient(f, probe.x, probe.y);
    const x0 = S.px(probe.x), y0 = S.py(probe.y);

    // Tangent to the contour: the right angle is the point of the picture.
    if (g.mag > 1e-4) {
      const tx = -g.fy / g.mag, ty = -(g.fx / g.mag);
      const r = 30 * S.dpr;
      c.strokeStyle = 'rgba(255,255,255,0.55)';
      c.lineWidth = 1.6 * S.dpr;
      c.setLineDash([4 * S.dpr, 4 * S.dpr]);
      c.beginPath();
      c.moveTo(x0 - tx * r, y0 - ty * r);
      c.lineTo(x0 + tx * r, y0 + ty * r);
      c.stroke();
      c.setLineDash([]);

      // Right-angle tick
      const ux = g.fx / g.mag, uy = -g.fy / g.mag;
      const q = 9 * S.dpr;
      c.lineWidth = 1.4 * S.dpr;
      c.strokeStyle = 'rgba(255,255,255,0.75)';
      c.beginPath();
      c.moveTo(x0 + tx * q, y0 + ty * q);
      c.lineTo(x0 + tx * q + ux * q, y0 + ty * q + uy * q);
      c.lineTo(x0 + ux * q, y0 + uy * q);
      c.stroke();

      const L = Math.min(Math.min(S.w, S.h) * 0.22, 26 * S.dpr + (g.mag / maxMag) * Math.min(S.w, S.h) * 0.18);
      const head = 11 * S.dpr;
      c.strokeStyle = 'rgba(0,0,0,0.65)'; c.fillStyle = 'rgba(0,0,0,0.65)';
      c.lineWidth = 7 * S.dpr;
      arrow(c, x0, y0, x0 + ux * L, y0 + uy * L, head * 1.25);
      c.strokeStyle = '#ffd166'; c.fillStyle = '#ffd166';
      c.lineWidth = 3.2 * S.dpr;
      arrow(c, x0, y0, x0 + ux * L, y0 + uy * L, head);
    }

    // Probe
    c.fillStyle = '#0a0e15';
    c.beginPath(); c.arc(x0, y0, 7 * S.dpr, 0, 6.2832); c.fill();
    c.fillStyle = '#ffd166';
    c.beginPath(); c.arc(x0, y0, 4.5 * S.dpr, 0, 6.2832); c.fill();
  });

  function stepBall(dt) {
    const g = gradient(f, ball.x, ball.y);
    ball.vx += (-g.fx * 5 - ball.vx * 3.2) * dt;
    ball.vy += (-g.fy * 5 - ball.vy * 3.2) * dt;
    ball.x = Math.max(-scene.xHalf, Math.min(scene.xHalf, ball.x + ball.vx * dt));
    ball.y = Math.max(-scene.yHalf, Math.min(scene.yHalf, ball.y + ball.vy * dt));
    ball.path.push(ball.x, ball.y);
    if (ball.path.length > 400) ball.path.splice(0, 2);
    probe.x = ball.x; probe.y = ball.y;
    if (Math.hypot(ball.vx, ball.vy) < 0.04 && g.mag < 0.05) {
      rolling = false;
      syncChrome();
    }
    syncHud();
  }

  /* ------------------------------------------------------------- chrome */

  function syncColorbar() {
    paintColorbar(cbarCv, app.colormap);
    cbarCap.textContent = t('grad.colorMeans');
    const n = 4;
    let html = '';
    for (let i = 0; i <= n; i++) {
      const v = range[1] - ((range[1] - range[0]) * i) / n;
      html += `<div style="top:${(i / n) * 100}%">${fmt(v, Math.abs(range[1] - range[0]) < 4 ? 1 : 0)}</div>`;
    }
    cbarTicks.innerHTML = html;
  }

  function syncHud() {
    const g = gradient(f, probe.x, probe.y);
    const z = f(probe.x, probe.y, 0);
    hudMain.innerHTML =
      `<span class="k">${tex('\\|\\nabla f\\|')}</span><b>${fmt(g.mag)}</b>` +
      `<span class="sep"></span>` +
      `<span class="k">${tex('f')}</span><b>${fmt(z)}</b>` +
      `<span class="sep hide-xs"></span>` +
      `<span class="dim hide-xs">(${fmt(probe.x, 1)}, ${fmt(probe.y, 1)})</span>`;

    // Marker on the colour bar: the bridge between the picture and the number.
    const u = norm(z);
    cbarMark.style.bottom = `${u * 100}%`;
    cbarMark.firstElementChild.textContent = fmt(z, 1);
    cbarMark.style.setProperty('--c', cssColor(app.colormap, u));

    if (!detail.hidden) syncDetail();
  }

  function syncDetail() {
    const g = gradient(f, probe.x, probe.y);
    detail.innerHTML = `
      <div class="calc">
        <div class="calc-row"><span class="calc-op"></span><span class="calc-lbl">${tex('\\partial f/\\partial x')}</span><b>${fmt(g.fx)}</b></div>
        <div class="calc-row"><span class="calc-op"></span><span class="calc-lbl">${tex('\\partial f/\\partial y')}</span><b>${fmt(g.fy)}</b></div>
        <div class="calc-sum"><span class="calc-op"></span><span class="calc-lbl">${tex('\\nabla f')}</span><b>(&#8201;${fmt(g.fx)}<em>,</em>${fmt(g.fy)}&#8201;)</b></div>
        <div class="calc-tag">${t('calc.pair')}</div>
      </div>
      <div class="sd-row"><span>${tex('\\|\\nabla f\\|')}</span><b>${fmt(g.mag, 3)}</b></div>
      <p class="sd-note">${g.mag < 0.02 ? t('grad.flat') : t('grad.perp')}</p>
      <p class="sd-note dim">${t('grad.scaleFixed')}</p>`;
  }

  function syncChrome() {
    pillName.textContent = pick(preset.name);
    fab.textContent = rolling ? t('grad.stop') : t('grad.roll');
    fab.classList.toggle('on', rolling);
    hudMore.textContent = detail.hidden ? '⋯' : '×';
    syncColorbar();
    syncHud();
  }

  /* ------------------------------------------------------------- events */

  scene.onResize(() => {
    rescale();
    syncColorbar();
    syncHud();
  });

  scene.onPointer((x, y) => {
    rolling = false;
    ball.path.length = 0;
    probe.x = Math.max(-scene.xHalf, Math.min(scene.xHalf, x));
    probe.y = Math.max(-scene.yHalf, Math.min(scene.yHalf, y));
    syncChrome();
  });

  stage.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'field') openFieldSheet();
    else if (act === 'details') { detail.hidden = !detail.hidden; syncChrome(); }
    else if (act === 'roll') {
      rolling = !rolling;
      if (rolling) {
        ball.x = probe.x; ball.y = probe.y; ball.vx = 0; ball.vy = 0;
        ball.path.length = 0; ball.path.push(ball.x, ball.y);
      }
      syncChrome();
    }
  });

  function openFieldSheet() {
    app.sheet({
      title: t('ui.field'),
      items: GRADIENT_PRESETS.map((p) => ({
        id: p.id,
        active: p.id === preset.id,
        name: pick(p.name),
        tex: p.tex,
        note: pick(p.hint),
        onPick: () => { probe = { x: 1.1, y: 0.9 }; setFormula(p.f, p); },
      })),
      custom: {
        label: 'f(x,y) =',
        value: formula,
        onApply: (src) => setFormula(src, null),
      },
    });
  }

  /* --------------------------------------------------------------- init */

  rescale();
  syncChrome();
  scene.start();

  return {
    scene,
    selectPreset(id) {
      const p = GRADIENT_PRESETS.find((q) => q.id === id);
      if (p) { probe = { x: 1.1, y: 0.9 }; setFormula(p.f, p); }
    },
    refresh() { rescale(); scene.invalidate(); syncChrome(); },
    relang() { syncChrome(); if (!detail.hidden) syncDetail(); },
    destroy() { scene.destroy(); host.innerHTML = ''; },
  };
}

  return { createGradient };
})();

/* ===== divergence.js ===== */
NV.divergence = (function () {
/* nablaViewer — divergence.js
 *
 * The original spawned particles at the probe centre when ∇·F > 0 and outside
 * it when ∇·F < 0.  That shows the sign only if you already know the answer.
 *
 * Here the probe window holds a *material blob* of fluid: a closed loop of
 * marker points carried by the field itself.  Divergence is exactly the rate
 * at which such a blob gains area,
 *
 *     d(ln A)/dt = ∇·F ,
 *
 * so the blob swells when the divergence is positive, shrinks when it is
 * negative, and — the case worth seeing — merely shears or rotates without
 * changing area when it is zero.  The area ratio is printed as it happens.
 *
 * Sign is carried by orange/blue (safe under red-green colour-vision
 * deficiency) and, more importantly, by shape: the blob grows or shrinks and
 * the boundary arrows point out or in.
 */

const { tryCompile, divergence, fluxAroundCircle } = NV.field;
const { DIVERGENCE_PRESETS } = NV.presets;
const { Scene, arrow } = NV.view;
const { t, pick } = NV.i18n;
const { tex } = NV.tex;
/* The field is advected at half real time: with ∇·F = 2 a blob would
 * otherwise multiply its area by e^4 in a second, too fast to watch. */
const FLOW = 0.5;

const OUT = '#ff9e4a';   // positive / outward
const IN = '#4aa8ff';    // negative / inward
const NEUTRAL = '#9fb0c4';

const fmt = (v, d = 2) => (Math.abs(v) < 5e-3 ? '0' : v.toFixed(d));

function createDivergence(host, app, initial) {
  let preset = DIVERGENCE_PRESETS.find((p) => p.id === initial) || DIVERGENCE_PRESETS[0];
  let P = tryCompile(preset.P).fn;
  let Q = tryCompile(preset.Q).fn;
  let probe = { ...preset.probe };
  let R = 0.4;

  const BLOB_N = 56;
  const blob = new Float64Array(BLOB_N * 2);
  let blobArea0 = 1;
  let blobAge = 0;

  const NP = 240;
  const parts = new Float32Array(NP * 2);
  const pAge = new Float32Array(NP);

  host.innerHTML = `
    <div class="stage">
      <canvas class="cv" aria-label="Divergence field"></canvas>
      <button class="pill pill-top" data-act="field"><b>∇·F</b><span class="pill-name"></span><i class="chev"></i></button>
      <div class="blobmeter">
        <div class="bm-label"></div>
        <div class="bm-wrap"><div class="bm-bar"><i></i></div><u>×1</u></div>
        <div class="bm-val"></div>
      </div>
      <div class="hud">
        <div class="hud-main"></div>
        <button class="hud-more" data-act="details"></button>
      </div>
      <button class="fab" data-act="release"></button>
      <div class="sheet-detail" hidden></div>
    </div>`;

  const stage = host.querySelector('.stage');
  const canvas = host.querySelector('.cv');
  const pillName = host.querySelector('.pill-name');
  const hudMain = host.querySelector('.hud-main');
  const hudMore = host.querySelector('.hud-more');
  const fab = host.querySelector('.fab');
  const detail = host.querySelector('.sheet-detail');
  const meter = host.querySelector('.blobmeter');
  const mLabel = host.querySelector('.bm-label');
  const mBar = host.querySelector('.bm-bar i');
  const mVal = host.querySelector('.bm-val');

  const scene = new Scene(canvas, { range: 3.4 });

  /* --------------------------------------------------------------- model */

  function resetBlob() {
    for (let i = 0; i < BLOB_N; i++) {
      const th = (i / BLOB_N) * 2 * Math.PI;
      blob[i * 2] = probe.x + R * Math.cos(th);
      blob[i * 2 + 1] = probe.y + R * Math.sin(th);
    }
    blobArea0 = Math.PI * R * R;
    blobAge = 0;
  }

  function blobAreaNow() {
    let a = 0;
    for (let i = 0; i < BLOB_N; i++) {
      const j = (i + 1) % BLOB_N;
      a += blob[i * 2] * blob[j * 2 + 1] - blob[j * 2] * blob[i * 2 + 1];
    }
    return Math.abs(a) / 2;
  }

  /** Midpoint rule: stable enough for the swirl cases at 60 fps. */
  function advect(x, y, dt) {
    const h = dt * FLOW;
    const k1x = P(x, y), k1y = Q(x, y);
    const mx = x + k1x * h * 0.5, my = y + k1y * h * 0.5;
    return [x + P(mx, my) * h, y + Q(mx, my) * h];
  }

  function seedParticles() {
    for (let i = 0; i < NP; i++) respawn(i, Math.random() * 60);
  }
  function respawn(i, age = 0) {
    parts[i * 2] = (Math.random() * 2 - 1) * scene.xHalf;
    parts[i * 2 + 1] = (Math.random() * 2 - 1) * scene.yHalf;
    pAge[i] = age;
  }

  function setField(p) {
    const a = tryCompile(p.P), b = tryCompile(p.Q);
    if (a.error || b.error) return a.error || b.error;
    P = a.fn; Q = b.fn;
    preset = p;
    if (p.probe) probe = { ...p.probe };
    resetBlob();
    seedParticles();
    scene.invalidate();
    syncChrome();
    return null;
  }

  /* --------------------------------------------------------- static layer */

  scene.onStatic((s, S) => {
    S.paintAxes(1, { grid: 'rgba(255,255,255,0.05)', axis: 'rgba(255,255,255,0.20)' });

    const n = app.density;
    const cell = Math.min(S.w, S.h) / n;
    let maxF = 1e-6;
    for (let j = 0; j <= n; j++) {
      for (let i = 0; i <= n; i++) {
        const x = -S.xHalf + (2 * S.xHalf * i) / n;
        const y = -S.yHalf + (2 * S.yHalf * j) / n;
        const m = Math.hypot(P(x, y), Q(x, y));
        if (m > maxF && Number.isFinite(m)) maxF = m;
      }
    }

    s.lineCap = 'round';
    for (let j = 0; j <= n; j++) {
      for (let i = 0; i <= n; i++) {
        const x = -S.xHalf + (2 * S.xHalf * i) / n;
        const y = -S.yHalf + (2 * S.yHalf * j) / n;
        const fx = P(x, y), fy = Q(x, y);
        const m = Math.hypot(fx, fy);
        if (!(m > 1e-4)) continue;
        // Length encodes speed, damped so one fast corner does not hide the rest.
        const L = Math.min(cell * 0.8, cell * 0.8 * Math.sqrt(m / maxF));
        if (L < 3 * S.dpr) continue;
        const x0 = S.px(x), y0 = S.py(y);
        s.strokeStyle = 'rgba(150,175,205,0.52)';
        s.fillStyle = 'rgba(150,175,205,0.52)';
        s.lineWidth = 1.3 * S.dpr;
        arrow(s, x0, y0, x0 + (fx / m) * L, y0 - (fy / m) * L, Math.max(3 * S.dpr, L * 0.3));
      }
    }
  });

  /* ---------------------------------------------------------- frame layer */

  scene.onFrame((c, S, dt) => {
    const { div } = divergence(P, Q, probe.x, probe.y);
    const tint = div > 0.08 ? OUT : div < -0.08 ? IN : NEUTRAL;

    // Faint flow lines give the field a direction without competing with the blob.
    c.fillStyle = 'rgba(190,210,235,0.34)';
    const dotR = 1.3 * S.dpr;
    for (let i = 0; i < NP; i++) {
      const [nx, ny] = advect(parts[i * 2], parts[i * 2 + 1], dt);
      parts[i * 2] = nx; parts[i * 2 + 1] = ny;
      pAge[i] += dt * 60;
      if (pAge[i] > 150 || Math.abs(nx) > S.xHalf * 1.05 || Math.abs(ny) > S.yHalf * 1.05) {
        respawn(i);
        continue;
      }
      c.beginPath();
      c.arc(S.px(nx), S.py(ny), dotR, 0, 6.2832);
      c.fill();
    }

    const cx = S.px(probe.x), cy = S.py(probe.y), pr = S.len(R);

    /* ---- the blob: divergence made literal ---- */
    blobAge += dt;
    let sx = 0, sy = 0;
    for (let i = 0; i < BLOB_N; i++) {
      const [nx, ny] = advect(blob[i * 2], blob[i * 2 + 1], dt);
      blob[i * 2] = nx; blob[i * 2 + 1] = ny;
      sx += nx; sy += ny;
    }

    /* Ride along with the parcel: slide the blob back so its centroid stays on
     * the probe.  Translation is the one motion on screen that says nothing
     * about ∇·F and the only one with a direction, so letting it dominate the
     * picture invites the reading that divergence is a vector.  It is not: the
     * number below is an area ratio.
     *
     * This is not a cosmetic lie.  For a linear field — source, sink, swirl,
     * shear — a point at c + δ obeys dδ/dt = A·δ with no reference to c, so
     * the area history is bit-identical with or without this step.  For a
     * field that varies in space, such as the dipole, pinning is the more
     * faithful of the two: the parcel stays where the divergence being
     * reported is measured, and as the window shrinks its area ratio converges
     * to exp(∇·F · t) at the probe.  A drifting parcel instead integrates the
     * divergence it meets along its path and settles on the wrong value. */
    const dx = probe.x - sx / BLOB_N;
    const dy = probe.y - sy / BLOB_N;
    for (let i = 0; i < BLOB_N; i++) {
      blob[i * 2] += dx; blob[i * 2 + 1] += dy;
    }

    const area = blobAreaNow();
    const ratio = area / blobArea0;
    if (blobAge > 6 || ratio > 5 || ratio < 0.06 || !Number.isFinite(ratio)) resetBlob();

    // Ease in after a restart, so the snap back to a circle reads as "starting
    // again" rather than as the blob having jumped somewhere.
    const fade = Math.min(1, blobAge / 0.35);

    c.globalAlpha = fade;
    c.beginPath();
    for (let i = 0; i < BLOB_N; i++) {
      const px = S.px(blob[i * 2]), py = S.py(blob[i * 2 + 1]);
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
    c.fillStyle = tint + '33';
    c.fill();
    c.strokeStyle = tint;
    c.lineWidth = 2.6 * S.dpr;
    c.stroke();

    // Marker dots: the blob is made of fluid particles, not a drawn shape.
    c.fillStyle = tint;
    for (let i = 0; i < BLOB_N; i += 7) {
      c.beginPath();
      c.arc(S.px(blob[i * 2]), S.py(blob[i * 2 + 1]), 2.2 * S.dpr, 0, 6.2832);
      c.fill();
    }
    c.globalAlpha = 1;

    /* The size the blob started at, drawn last so it is never hidden underneath
     * it.  Without this on top there is nothing to measure the growth against,
     * and "the circle got bigger" has no answer to "bigger than what?". */
    c.strokeStyle = 'rgba(255,255,255,0.55)';
    c.lineWidth = 1.4 * S.dpr;
    c.setLineDash([4 * S.dpr, 4 * S.dpr]);
    c.beginPath(); c.arc(cx, cy, pr, 0, 6.2832); c.stroke();
    c.setLineDash([]);

    /* ---- boundary flux F·n, the other half of the definition ---- */
    const NB = 16;
    for (let i = 0; i < NB; i++) {
      const th = (i / NB) * 2 * Math.PI;
      const nx = Math.cos(th), ny = Math.sin(th);
      const bx = probe.x + R * nx, by = probe.y + R * ny;
      const fn = P(bx, by) * nx + Q(bx, by) * ny;
      if (Math.abs(fn) < 1e-3) continue;
      const L = Math.min(26 * S.dpr, Math.abs(fn) * 13 * S.dpr);
      if (L < 4 * S.dpr) continue;
      const sgn = Math.sign(fn);
      const x0 = S.px(bx), y0 = S.py(by);
      c.strokeStyle = fn > 0 ? OUT : IN;
      c.fillStyle = fn > 0 ? OUT : IN;
      c.lineWidth = 1.8 * S.dpr;
      arrow(c, x0, y0, x0 + nx * sgn * L, y0 - ny * sgn * L, 5 * S.dpr);
    }

    c.fillStyle = '#0a0e15';
    c.beginPath(); c.arc(cx, cy, 5.5 * S.dpr, 0, 6.2832); c.fill();
    c.fillStyle = tint;
    c.beginPath(); c.arc(cx, cy, 3.4 * S.dpr, 0, 6.2832); c.fill();

    syncMeter(ratio, div);
  });

  /* -------------------------------------------------------------- chrome */

  let meterTick = 0;
  function syncMeter(ratio, div) {
    if (++meterTick % 4) return;   // the DOM does not need 60 updates a second
    const grow = ratio > 1.03, shrink = ratio < 0.97;
    mLabel.textContent = t('div.areaNow');
    mVal.textContent = `×${ratio.toFixed(2)}`;
    meter.dataset.state = grow ? 'up' : shrink ? 'down' : 'flat';
    // log scale: ×1 sits in the middle, ×4 and ×1/4 at the ends
    const u = Math.max(0, Math.min(1, 0.5 + Math.log(ratio) / (2 * Math.log(4))));
    mBar.style.height = `${u * 100}%`;
    mVal.dataset.word = grow ? t('div.growing') : shrink ? t('div.shrinking') : t('div.steady');
    if (!detail.hidden) syncDetail(div);
  }

  function syncHud() {
    const { div } = divergence(P, Q, probe.x, probe.y);
    const word = div > 0.08 ? t('div.source') : div < -0.08 ? t('div.sink') : t('div.neutral');
    const tint = div > 0.08 ? OUT : div < -0.08 ? IN : NEUTRAL;
    hudMain.innerHTML =
      `<i class="dot" style="background:${tint}"></i>` +
      `<span class="k">${tex('\\nabla\\cdot\\mathbf{F}')}</span>` +
      `<b>${div > 0 ? '+' : ''}${fmt(div)}</b>` +
      `<span class="sep"></span><span class="dim">${word}</span>` +
      `<span class="sep hide-xs"></span>` +
      `<span class="dim hide-xs">(${fmt(probe.x, 1)}, ${fmt(probe.y, 1)})</span>`;
  }

  function syncDetail(divNow) {
    const d = divergence(P, Q, probe.x, probe.y);
    const flux = fluxAroundCircle(P, Q, probe.x, probe.y, R);
    const area = Math.PI * R * R;
    detail.innerHTML = `
      <div class="calc">
        <div class="calc-row"><span class="calc-op"></span><span class="calc-lbl">${tex('\\partial P/\\partial x')}</span><b>${fmt(d.dPdx)}</b></div>
        <div class="calc-row"><span class="calc-op">+</span><span class="calc-lbl">${tex('\\partial Q/\\partial y')}</span><b>${fmt(d.dQdy)}</b></div>
        <div class="calc-sum"><span class="calc-op"></span><span class="calc-lbl">${tex('\\nabla\\cdot\\mathbf{F}')}</span><b>${fmt(d.div)}</b></div>
        <div class="calc-tag">${t('calc.sum')}</div>
      </div>
      <div class="sd-row"><span>${tex('\\oint \\mathbf{F}\\cdot\\mathbf{n}\\,ds')}</span><b>${fmt(flux)}</b></div>
      <div class="sd-row"><span>${tex('\\oint \\mathbf{F}\\cdot\\mathbf{n}\\,ds / A')}</span><b>${fmt(flux / area)}</b></div>
      <p class="sd-note">${t('div.meaning')}</p>
      <p class="sd-note dim">${t('div.scalarNote')}</p>`;
  }

  function syncChrome() {
    pillName.textContent = pick(preset.name);
    fab.textContent = t('div.release');
    hudMore.textContent = detail.hidden ? '⋯' : '×';
    syncHud();
    if (!detail.hidden) syncDetail();
  }

  /* -------------------------------------------------------------- events */

  scene.onPointer((x, y) => {
    probe.x = Math.max(-scene.xHalf + R, Math.min(scene.xHalf - R, x));
    probe.y = Math.max(-scene.yHalf + R, Math.min(scene.yHalf - R, y));
    resetBlob();
    syncHud();
  });

  stage.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'field') openFieldSheet();
    else if (act === 'details') { detail.hidden = !detail.hidden; syncChrome(); }
    else if (act === 'release') resetBlob();
  });

  function openFieldSheet() {
    app.sheet({
      title: t('ui.field'),
      items: DIVERGENCE_PRESETS.map((p) => ({
        id: p.id,
        active: p.id === preset.id,
        name: pick(p.name),
        tex: p.tex,
        note: pick(p.hint),
        onPick: () => setField(p),
      })),
      custom: {
        label: '\\mathbf{F} =',
        pair: true,
        value: preset.P,
        value2: preset.Q,
        onApply: (p, q) => setField({
          id: 'custom', P: p, Q: q,
          name: { en: t('ui.customField'), ja: t('ui.customField') },
          tex: `\\mathbf{F} = (${p},\\ ${q})`, result: '', hint: { en: '', ja: '' },
          probe: { ...probe },
        }),
      },
      slider: {
        label: t('ui.windowSize'), min: 0.2, max: 0.9, step: 0.05, value: R,
        onInput: (v) => { R = v; resetBlob(); },
      },
    });
  }

  /* ----------------------------------------------------------------- init */

  resetBlob();
  seedParticles();
  syncChrome();
  scene.start();

  return {
    scene,
    selectPreset(id) {
      const p = DIVERGENCE_PRESETS.find((q) => q.id === id);
      if (p) setField(p);
    },
    refresh() { scene.invalidate(); syncChrome(); },
    relang() { syncChrome(); },
    destroy() { scene.destroy(); host.innerHTML = ''; },
  };
}

  return { createDivergence };
})();

/* ===== curl.js ===== */
NV.curl = (function () {
/* nablaViewer — curl.js
 *
 * Kept close to the original: the paddle wheel already reads well.  The wheel
 * turns at ω = ½(∇×F)_z, the sign is carried by the direction it turns (and
 * by the ⊙ / ⊗ in the hub, after the right-hand rule), and the tangential
 * arrows around the rim show where the circulation comes from.
 */

const { tryCompile, curl, circulationAroundCircle } = NV.field;
const { CURL_PRESETS } = NV.presets;
const { Scene, arrow } = NV.view;
const { t, pick } = NV.i18n;
const { tex } = NV.tex;
const CCW = '#c08cff';
const CW = '#ffc14a';
const STILL = '#9fb0c4';

const fmt = (v, d = 2) => (Math.abs(v) < 5e-3 ? '0' : v.toFixed(d));

function createCurl(host, app, initial) {
  let preset = CURL_PRESETS.find((p) => p.id === initial) || CURL_PRESETS[1];  // shear paradox by default
  let P = tryCompile(preset.P).fn;
  let Q = tryCompile(preset.Q).fn;
  let probe = { ...preset.probe };
  let R = 0.4;
  let wheel = 0;                       // accumulated wheel angle, radians

  const NP = 240;
  const parts = new Float32Array(NP * 2);
  const pAge = new Float32Array(NP);

  host.innerHTML = `
    <div class="stage">
      <canvas class="cv" aria-label="Curl field"></canvas>
      <button class="pill pill-top" data-act="field"><b>∇×F</b><span class="pill-name"></span><i class="chev"></i></button>
      <div class="hud">
        <div class="hud-main"></div>
        <button class="hud-more" data-act="details"></button>
      </div>
      <div class="sheet-detail" hidden></div>
    </div>`;

  const stage = host.querySelector('.stage');
  const canvas = host.querySelector('.cv');
  const pillName = host.querySelector('.pill-name');
  const hudMain = host.querySelector('.hud-main');
  const hudMore = host.querySelector('.hud-more');
  const detail = host.querySelector('.sheet-detail');

  const scene = new Scene(canvas, { range: 3.4 });

  const FLOW = 0.5;   // matches the divergence view, so the two feel alike

  function advect(x, y, dt) {
    const h = dt * FLOW;
    const k1x = P(x, y), k1y = Q(x, y);
    const mx = x + k1x * h * 0.5, my = y + k1y * h * 0.5;
    return [x + P(mx, my) * h, y + Q(mx, my) * h];
  }

  function seedParticles() {
    for (let i = 0; i < NP; i++) respawn(i, Math.random() * 60);
  }
  function respawn(i, age = 0) {
    parts[i * 2] = (Math.random() * 2 - 1) * scene.xHalf;
    parts[i * 2 + 1] = (Math.random() * 2 - 1) * scene.yHalf;
    pAge[i] = age;
  }

  function setField(p) {
    const a = tryCompile(p.P), b = tryCompile(p.Q);
    if (a.error || b.error) return a.error || b.error;
    P = a.fn; Q = b.fn;
    preset = p;
    if (p.probe) probe = { ...p.probe };
    wheel = 0;
    seedParticles();
    scene.invalidate();
    syncChrome();
    return null;
  }

  /* --------------------------------------------------------- static layer */

  scene.onStatic((s, S) => {
    S.paintAxes(1, { grid: 'rgba(255,255,255,0.05)', axis: 'rgba(255,255,255,0.20)' });

    const n = app.density;
    const cell = Math.min(S.w, S.h) / n;
    let maxF = 1e-6;
    for (let j = 0; j <= n; j++) {
      for (let i = 0; i <= n; i++) {
        const x = -S.xHalf + (2 * S.xHalf * i) / n;
        const y = -S.yHalf + (2 * S.yHalf * j) / n;
        const m = Math.hypot(P(x, y), Q(x, y));
        if (m > maxF && Number.isFinite(m)) maxF = m;
      }
    }

    s.lineCap = 'round';
    for (let j = 0; j <= n; j++) {
      for (let i = 0; i <= n; i++) {
        const x = -S.xHalf + (2 * S.xHalf * i) / n;
        const y = -S.yHalf + (2 * S.yHalf * j) / n;
        const fx = P(x, y), fy = Q(x, y);
        const m = Math.hypot(fx, fy);
        if (!(m > 1e-4)) continue;
        const L = Math.min(cell * 0.8, cell * 0.8 * Math.sqrt(m / maxF));
        if (L < 3 * S.dpr) continue;
        const x0 = S.px(x), y0 = S.py(y);
        s.strokeStyle = 'rgba(150,175,205,0.52)';
        s.fillStyle = 'rgba(150,175,205,0.52)';
        s.lineWidth = 1.3 * S.dpr;
        arrow(s, x0, y0, x0 + (fx / m) * L, y0 - (fy / m) * L, Math.max(3 * S.dpr, L * 0.3));
      }
    }
  });

  /* ---------------------------------------------------------- frame layer */

  scene.onFrame((c, S, dt) => {
    const { curl: cz } = curl(P, Q, probe.x, probe.y);
    const omega = 0.5 * cz;
    const tint = cz > 0.08 ? CCW : cz < -0.08 ? CW : STILL;

    c.fillStyle = 'rgba(190,210,235,0.34)';
    const dotR = 1.3 * S.dpr;
    for (let i = 0; i < NP; i++) {
      const [nx, ny] = advect(parts[i * 2], parts[i * 2 + 1], dt);
      parts[i * 2] = nx; parts[i * 2 + 1] = ny;
      pAge[i] += dt * 60;
      if (pAge[i] > 150 || Math.abs(nx) > S.xHalf * 1.05 || Math.abs(ny) > S.yHalf * 1.05) {
        respawn(i);
        continue;
      }
      c.beginPath();
      c.arc(S.px(nx), S.py(ny), dotR, 0, 6.2832);
      c.fill();
    }

    const cx = S.px(probe.x), cy = S.py(probe.y), pr = S.len(R);

    // Tangential component F·t around the rim: where the torque comes from.
    const NB = 20;
    for (let i = 0; i < NB; i++) {
      const th = (i / NB) * 2 * Math.PI;
      const bx = probe.x + R * Math.cos(th), by = probe.y + R * Math.sin(th);
      const tx = -Math.sin(th), ty = Math.cos(th);
      const ft = P(bx, by) * tx + Q(bx, by) * ty;
      if (Math.abs(ft) < 1e-3) continue;
      const L = Math.min(24 * S.dpr, Math.abs(ft) * 11 * S.dpr);
      if (L < 4 * S.dpr) continue;
      const sgn = Math.sign(ft);
      const x0 = S.px(bx), y0 = S.py(by);
      c.strokeStyle = ft > 0 ? CCW : CW;
      c.fillStyle = ft > 0 ? CCW : CW;
      c.lineWidth = 1.7 * S.dpr;
      arrow(c, x0, y0, x0 + tx * sgn * L, y0 - ty * sgn * L, 5 * S.dpr);
    }

    c.strokeStyle = tint + 'aa';
    c.lineWidth = 1.6 * S.dpr;
    c.setLineDash([4 * S.dpr, 4 * S.dpr]);
    c.beginPath(); c.arc(cx, cy, pr, 0, 6.2832); c.stroke();
    c.setLineDash([]);
    c.fillStyle = tint + '1f';
    c.beginPath(); c.arc(cx, cy, pr, 0, 6.2832); c.fill();

    /* ---- the paddle wheel ---- */
    wheel += omega * dt;
    c.save();
    c.translate(cx, cy);
    c.rotate(-wheel);               // canvas y points down, so negate to spin the maths way
    for (let b = 0; b < 4; b++) {
      c.save();
      c.rotate((b * Math.PI) / 2);
      c.strokeStyle = '#e6edf7';
      c.lineWidth = 2.6 * S.dpr;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(pr * 0.88, 0); c.stroke();
      c.fillStyle = tint;
      c.beginPath();
      c.rect(pr * 0.52, -pr * 0.17, pr * 0.36, pr * 0.34);
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.85)';
      c.lineWidth = 1 * S.dpr;
      c.stroke();
      c.restore();
    }
    // Hub, with the right-hand-rule symbol: ⊙ out of the screen, ⊗ into it.
    c.fillStyle = '#0a0e15';
    c.beginPath(); c.arc(0, 0, pr * 0.24, 0, 6.2832); c.fill();
    c.strokeStyle = tint;
    c.lineWidth = 2 * S.dpr;
    c.stroke();
    const q = Math.max(3 * S.dpr, pr * 0.1);
    if (cz > 0.08) {
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(0, 0, q, 0, 6.2832); c.fill();
    } else if (cz < -0.08) {
      c.strokeStyle = '#ffffff';
      c.lineWidth = 1.8 * S.dpr;
      c.beginPath();
      c.moveTo(-q, -q); c.lineTo(q, q); c.moveTo(q, -q); c.lineTo(-q, q);
      c.stroke();
    } else {
      c.fillStyle = STILL;
      c.beginPath(); c.arc(0, 0, q * 0.6, 0, 6.2832); c.fill();
    }
    c.restore();

    syncHudThrottled(cz, omega);
  });

  /* -------------------------------------------------------------- chrome */

  let tick = 0;
  /** The HUD text only needs a few updates a second, not sixty. */
  function syncHudThrottled(cz, omega) {
    if (++tick % 5) return;
    syncHud(cz, omega);
  }

  function syncHud(cz, omega) {
    const word = cz > 0.08 ? t('curl.ccw') : cz < -0.08 ? t('curl.cw') : t('curl.still');
    const tint = cz > 0.08 ? CCW : cz < -0.08 ? CW : STILL;
    hudMain.innerHTML =
      `<i class="dot" style="background:${tint}"></i>` +
      `<span class="k">${tex('(\\nabla\\times\\mathbf{F})_z')}</span>` +
      `<b>${cz > 0 ? '+' : ''}${fmt(cz)}</b>` +
      `<span class="sep"></span><span class="dim">${word}</span>` +
      `<span class="sep hide-xs"></span>` +
      `<span class="dim hide-xs">${tex('\\omega')} ${fmt(omega)}</span>`;
    if (!detail.hidden) syncDetail();
  }

  function syncDetail() {
    const d = curl(P, Q, probe.x, probe.y);
    const circ = circulationAroundCircle(P, Q, probe.x, probe.y, R);
    const area = Math.PI * R * R;
    detail.innerHTML = `
      <div class="calc">
        <div class="calc-row"><span class="calc-op"></span><span class="calc-lbl">${tex('\\partial Q/\\partial x')}</span><b>${fmt(d.dQdx)}</b></div>
        <div class="calc-row"><span class="calc-op">−</span><span class="calc-lbl">${tex('\\partial P/\\partial y')}</span><b>${fmt(d.dPdy)}</b></div>
        <div class="calc-sum"><span class="calc-op"></span><span class="calc-lbl">${tex('(\\nabla\\times\\mathbf{F})_z')}</span><b>${fmt(d.curl)}</b></div>
        <div class="calc-tag">${t('calc.diff')}</div>
      </div>
      <div class="sd-row"><span>${tex('\\oint \\mathbf{F}\\cdot d\\mathbf{r}')}</span><b>${fmt(circ)}</b></div>
      <div class="sd-row"><span>${tex('\\oint \\mathbf{F}\\cdot d\\mathbf{r} / A')}</span><b>${fmt(circ / area)}</b></div>
      <p class="sd-note">${t('curl.meaning')}</p>`;
  }

  function syncChrome() {
    pillName.textContent = pick(preset.name);
    hudMore.textContent = detail.hidden ? '⋯' : '×';
    const { curl: cz } = curl(P, Q, probe.x, probe.y);
    syncHud(cz, 0.5 * cz);
  }

  /* -------------------------------------------------------------- events */

  scene.onPointer((x, y) => {
    probe.x = Math.max(-scene.xHalf + R, Math.min(scene.xHalf - R, x));
    probe.y = Math.max(-scene.yHalf + R, Math.min(scene.yHalf - R, y));
  });

  stage.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'field') openFieldSheet();
    else if (act === 'details') { detail.hidden = !detail.hidden; syncChrome(); }
  });

  function openFieldSheet() {
    app.sheet({
      title: t('ui.field'),
      items: CURL_PRESETS.map((p) => ({
        id: p.id,
        active: p.id === preset.id,
        name: pick(p.name),
        tex: p.tex,
        note: pick(p.hint),
        onPick: () => setField(p),
      })),
      custom: {
        label: '\\mathbf{F} =',
        pair: true,
        value: preset.P,
        value2: preset.Q,
        onApply: (p, q) => setField({
          id: 'custom', P: p, Q: q,
          name: { en: t('ui.customField'), ja: t('ui.customField') },
          tex: `\\mathbf{F} = (${p},\\ ${q})`, result: '', hint: { en: '', ja: '' },
          probe: { ...probe },
        }),
      },
      slider: {
        label: t('ui.wheelSize'), min: 0.2, max: 0.9, step: 0.05, value: R,
        onInput: (v) => { R = v; },
      },
    });
  }

  /* ----------------------------------------------------------------- init */

  seedParticles();
  syncChrome();
  scene.start();

  return {
    scene,
    selectPreset(id) {
      const p = CURL_PRESETS.find((q) => q.id === id);
      if (p) setField(p);
    },
    refresh() { scene.invalidate(); syncChrome(); },
    relang() { syncChrome(); },
    destroy() { scene.destroy(); host.innerHTML = ''; },
  };
}

  return { createCurl };
})();

/* ===== quiz.js ===== */
NV.quiz = (function () {
/* nablaViewer — quiz.js
 *
 * Nine questions, one on screen at a time.
 *
 * Every derivation below was checked by hand against
 *   ∇f = (f_x, f_y),  ∇·F = P_x + Q_y,  (∇×F)_z = Q_x − P_y.
 * The English is written to read naturally rather than translated from the
 * Japanese, and each explanation is two or three sentences at most.
 */

const { t, pick } = NV.i18n;
const { tex } = NV.tex;
const Q = [
  {
    id: 'grad-perp',
    topic: 'gradient',
    jump: { tab: 'gradient', preset: 'bowl' },
    prompt: 'f(x,y) = x^2 + y^2',

      en: 'What is ∇f at the point (1, 1), and how does it meet the level curve through that point?',

      {

        ja: '(1, 1) — 等高線に沿って進む。',

      en: 'Here ∇f = (2x, 2y), which is (2, 2) at (1, 1). Along a level curve the height never changes, so ∇f · dr = 0 for any step dr tangent to the curve — and a zero dot product means the two are perpendicular.',
      ja: '∇f = (2x, 2y) なので (1,1) では (2,2) です。等高線に沿って高さは変化しないため、接線方向の変位 dr に対して ∇f · dr = 0 となり、内積がゼロであることは両者が直交することを意味します。',
    },
    math: [
      '\\nabla f = (2x,\\, 2y) \\implies \\nabla f(1,1) = (2,\\, 2)',
      '\\nabla f \\cdot d\\mathbf{r} = 0 \\text{ along } f = C',
    ],
  },

  {
    id: 'grad-rate',
    topic: 'gradient',
    jump: { tab: 'gradient', preset: 'plane' },

    },
    options: [
      { ok: true, en: '5, which is ‖∇f‖.', ja: '5（すなわち ‖∇f‖）。' },

      ja: '単位ベクトル u 方向の方向微分は D_u f = ∇f · u = ‖∇f‖ cos θ です。u が ∇f と同じ向きのとき最大になり、その最大値は ‖∇f‖ = √(3² + 4²) = 5 です。',
    },
    math: 'D_{\\mathbf{u}} f = \\nabla f \\cdot \\mathbf{u} \\le \\|\\nabla f\\| = \\sqrt{3^2 + 4^2} = 5',
  },

  {
    id: 'div-zero',
    topic: 'divergence',
    jump: { tab: 'divergence', preset: 'swirl' },

  {

    why: {

    math: [
      '\\oint \\mathbf{F}\\cdot\\mathbf{n}\\,ds = \\iint (\\nabla\\cdot\\mathbf{F})\\,dA',

  },

  {
    id: 'curl-shear',
    topic: 'curl',
    jump: { tab: 'curl', preset: 'shear' },
    prompt: '\\mathbf{F}(x,y) = (y,\\, 0)',
    q: {
      en: 'Every streamline of F = (y, 0) is a straight horizontal line. What does a small paddle wheel placed at (0, 1) do?',

      ja: '(∇×F)_z = ∂Q/∂x − ∂P/∂y = 0 − 1 = −1 です。羽根車の上側の流れが下側より速く右へ進むため、上の羽根が強く押されて時計回りに回ります。回転は流線が曲がっているかどうかではなく、局所的な循環を測る量です。',
    },

  {

    topic: 'curl',
    jump: { tab: 'curl', preset: 'free-vortex' },

    q: {

      ja: 'この場の流線は同心円を描きます。原点を除いた領域で (∇×F)_z はいくつですか。',
    },
    options: [
      { ok: true, en: 'Exactly zero — the paddle wheel does not turn.', ja: '厳密にゼロ — 羽根車は回らない。' },
      { en: '+2 everywhere, as in rigid rotation.', ja: '剛体回転と同じく、至る所で +2。' },
      { en: 'Negative, because the speed falls off with radius.', ja: '半径とともに速さが落ちるので、負の値。' },
      { en: 'Infinite at every point.', ja: 'すべての点で無限大。' },
    ],
    why: {
      en: 'With P = −y/r² and Q = x/r², both ∂Q/∂x and ∂P/∂y come out as (y² − x²)/r⁴, so their difference is zero for r > 0. Physically, two effects cancel: being carried around the circle would turn the wheel counter-clockwise, while the faster inner fluid outrunning the slower outer fluid would turn it clockwise.',
      ja: 'P = −y/r²、Q = x/r² とすると ∂Q/∂x も ∂P/∂y も (y² − x²)/r⁴ となり、r > 0 で差はゼロです。物理的には二つの効果が相殺します。円に沿って運ばれる効果は反時計回りに、内側の速い流れが外側の遅い流れを追い越す効果は時計回りに働きます。',
    },
    math: [
      '\\frac{\\partial Q}{\\partial x} = \\frac{y^2 - x^2}{r^4} = \\frac{\\partial P}{\\partial y}',
      '\\implies (\\nabla\\times\\mathbf{F})_z = 0 \\quad (r > 0)',
    ],
  },

  {
    id: 'curl-pipe',
    topic: 'curl',
    jump: { tab: 'curl', preset: 'pipe' },
    prompt: '\\mathbf{F}(x,y) = (1.5 - y^2,\\, 0)',
    q: {
      en: 'In this pipe flow, where does a paddle wheel turn counter-clockwise?',
      ja: 'この管内流において、羽根車が反時計回りに回るのはどこですか。',
    },
    options: [
      { ok: true, en: 'Above the centre line, where y > 0.', ja: '中心線より上、y > 0 の領域。' },
      { en: 'Below the centre line, where y < 0.', ja: '中心線より下、y < 0 の領域。' },
      { en: 'Only exactly on the centre line, y = 0.', ja: '中心線上 y = 0 のみ。' },
      { en: 'Nowhere — the streamlines are straight.', ja: 'どこでも回らない — 流線が直線だから。' },
    ],
    why: {
      en: '(∇×F)_z = 0 − ∂(1.5 − y²)/∂y = 2y. It is positive above the centre line, negative below it, and zero on it, so the wheel reverses as you drag it across y = 0.',
      ja: '(∇×F)_z = 0 − ∂(1.5 − y²)/∂y = 2y です。中心線より上では正、下では負、中心線上ではゼロなので、y = 0 を越えると回る向きが逆転します。',
    },
    math: '(\\nabla\\times\\mathbf{F})_z = -\\frac{\\partial (1.5 - y^2)}{\\partial y} = 2y',
  },

  {
    id: 'id-curl-grad',
    topic: 'gradient',
    jump: { tab: 'gradient', preset: 'ripple' },
    prompt: '\\nabla \\times (\\nabla f) = \\;?',
    q: {
      en: 'For a scalar field f whose second partial derivatives are continuous, what is ∇ × (∇f)?',
      ja: '2階偏導関数が連続なスカラー場 f に対して、∇ × (∇f) はいくつですか。',
    },
    options: [
      { ok: true, en: 'The zero vector, at every point.', ja: 'すべての点でゼロベクトル。' },
      { en: 'The Laplacian ∇²f.', ja: 'ラプラシアン ∇²f。' },
      { en: '‖∇f‖².', ja: '‖∇f‖²。' },
      { en: 'It depends on where the origin is placed.', ja: '原点の取り方によって変わる。' },
    ],
    why: {
      en: 'Each component is a difference of mixed second partials — for instance the z component is ∂²f/∂x∂y − ∂²f/∂y∂x. Clairaut’s theorem makes those equal whenever they are continuous, so every component vanishes. This is why an electrostatic field E = −∇V has no swirl.',
      ja: '各成分は混合2階偏導関数の差になります。例えば z 成分は ∂²f/∂x∂y − ∂²f/∂y∂x です。連続であればクレローの定理によりこれらは等しく、すべての成分が消えます。静電場 E = −∇V が渦を持たない理由です。',
    },
    math: '(\\nabla\\times\\nabla f)_z = \\frac{\\partial^2 f}{\\partial x \\partial y} - \\frac{\\partial^2 f}{\\partial y \\partial x} = 0',
  },

  {
    id: 'id-div-curl',
    topic: 'divergence',
    jump: { tab: 'divergence', preset: 'swirl' },
    prompt: '\\nabla \\cdot (\\nabla \\times \\mathbf{F}) = \\;?',
    q: {
      en: 'For a vector field F whose second partial derivatives are continuous, what is ∇ · (∇ × F)?',
      ja: '2階偏導関数が連続なベクトル場 F に対して、∇ · (∇ × F) はいくつですか。',
    },
    options: [
      { ok: true, en: 'Zero, at every point.', ja: 'すべての点でゼロ。' },
      { en: 'The Laplacian of F.', ja: 'F のラプラシアン。' },
      { en: 'Twice the divergence of F.', ja: 'F の発散の2倍。' },
      { en: 'Zero only for fields that have no sources.', ja: '湧き出しを持たない場に限ってゼロ。' },
    ],
    why: {
      en: 'Expanding it gives six mixed second partials that cancel in pairs, so the result is zero for every F. This is the reason ∇·B = 0: writing B as the curl of a vector potential forces it to have no sources, which is why magnetic field lines close on themselves.',
      ja: '展開すると混合2階偏導関数が6個現れ、2個ずつ打ち消し合うため、任意の F に対してゼロになります。磁束密度を B = ∇ × A と書けば自動的に ∇·B = 0 となり、磁力線が閉じる理由になっています。',
    },
    math: [
      '\\nabla\\cdot(\\nabla\\times\\mathbf{F}) = 0 \\text{ for every } \\mathbf{F}',
      '\\mathbf{B} = \\nabla\\times\\mathbf{A} \\implies \\nabla\\cdot\\mathbf{B} = 0',
    ],
  },
];

function createQuiz(host, app) {
  let idx = 0;
  let chosen = null;
  const answers = new Array(Q.length).fill(null);

  host.innerHTML = `<div class="quiz"><div class="quiz-inner"></div></div>`;
  const inner = host.querySelector('.quiz-inner');

  function score() {
    return answers.reduce((n, a, i) => n + (a !== null && Q[i].options[a].ok ? 1 : 0), 0);
  }

  function render() {
    const q = Q[idx];
    const answered = answers[idx] !== null;
    const correct = answered && q.options[answers[idx]].ok;

    inner.innerHTML = `
      <div class="quiz-top">
        <div class="quiz-prog">
          <span class="quiz-step">${idx + 1} / ${Q.length}</span>
          <div class="quiz-dots">${Q.map((_, i) => {
            const a = answers[i];
            const cls = a === null ? '' : Q[i].options[a].ok ? ' ok' : ' no';
            return `<i class="${i === idx ? 'cur' : ''}${cls}" data-go="${i}"></i>`;
          }).join('')}</div>
        </div>
        <span class="quiz-score">${t('quiz.score')} <b>${score()}</b>/${Q.length}</span>
      </div>

      <div class="quiz-card">
        <div class="quiz-prompt tex">${tex(q.prompt)}</div>
        <p class="quiz-q">${pick(q.q)}</p>
        <div class="quiz-opts">
          ${q.options.map((o, i) => {
            let cls = '';
            if (answered) {
              if (o.ok) cls = ' ok';
              else if (i === answers[idx]) cls = ' no';
              else cls = ' dim';
            }
            return `<button class="quiz-opt${cls}" data-pick="${i}" ${answered ? 'disabled' : ''}>
              <span class="quiz-letter">${String.fromCharCode(65 + i)}</span>
              <span>${pick(o)}</span>
            </button>`;
          }).join('')}
        </div>

        ${answered ? `
          <div class="quiz-why ${correct ? 'ok' : 'no'}">
            <div class="quiz-verdict">${correct ? '✓ ' + t('quiz.correct') : '✕ ' + t('quiz.incorrect')}</div>
            <p>${pick(q.why)}</p>
            ${(Array.isArray(q.math) ? q.math : [q.math])
              .map((m) => `<div class="quiz-math tex">${tex(m)}</div>`).join('')}
            <div class="quiz-actions">
              <button class="btn ghost" data-see="1">${t('quiz.seeIt')} →</button>
              ${idx < Q.length - 1
                ? `<button class="btn" data-next="1">${idx + 2} / ${Q.length} →</button>`
                : `<button class="btn" data-restart="1">${t('quiz.again')}</button>`}
            </div>
          </div>` : ''}
      </div>`;
  }

  host.addEventListener('click', (e) => {
    const el = e.target.closest('[data-pick],[data-next],[data-restart],[data-see],[data-go]');
    if (!el) return;
    if (el.dataset.pick !== undefined && answers[idx] === null) {
      answers[idx] = Number(el.dataset.pick);
      render();
      inner.querySelector('.quiz-why')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else if (el.dataset.next) {
      idx = Math.min(Q.length - 1, idx + 1);
      inner.parentElement.scrollTop = 0;
      render();
    } else if (el.dataset.go !== undefined) {
      idx = Number(el.dataset.go);
      inner.parentElement.scrollTop = 0;
      render();
    } else if (el.dataset.restart) {
      answers.fill(null);
      idx = 0;
      inner.parentElement.scrollTop = 0;
      render();
    } else if (el.dataset.see) {
      app.goto(Q[idx].jump.tab, Q[idx].jump.preset);
    }
  });

  render();

  return {
    refresh() {},
    relang() { render(); },
    destroy() { host.innerHTML = ''; },
  };
}

  return { createQuiz };
})();

/* ===== app.js ===== */
NV.app = (function () {
/* nablaViewer — app.js
 * Shell: tabs, bottom sheets, language, colour scale, handbook.
 *
 * Only one visualiser exists at a time.  Switching tabs destroys the previous
 * one and releases its canvases, which keeps the resident footprint to a
 * single viewport-sized surface rather than three.
 */

const { initLang, setLang, getLang, t } = NV.i18n;
const { COLORMAPS, cssColor } = NV.colormap;
const { tex } = NV.tex;
const { createGradient } = NV.gradient;
const { createDivergence } = NV.divergence;
const { createCurl } = NV.curl;
const { createQuiz } = NV.quiz;
const TABS = [
  { id: 'gradient', sym: '∇f', key: 'tab.gradient', make: createGradient },
  { id: 'divergence', sym: '∇·F', key: 'tab.divergence', make: createDivergence },
  { id: 'curl', sym: '∇×F', key: 'tab.curl', make: createCurl },
  { id: 'quiz', sym: '?', key: 'tab.quiz', make: createQuiz },
];

const store = {
  get(k, d) { try { const v = localStorage.getItem(`nv.${k}`); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(`nv.${k}`, v); } catch { /* private mode */ } },
};

const app = {
  colormap: store.get('cmap', 'viridis'),
  density: Number(store.get('density', 13)),
  sheet: openSheet,
  goto,
};

let current = null;
let currentTab = null;

const view = document.getElementById('view');
const tabsEl = document.getElementById('tabs');
const sheetEl = document.getElementById('sheet');
const langBtn = document.getElementById('lang');
const bookBtn = document.getElementById('book');
const gearBtn = document.getElementById('gear');

/* ------------------------------------------------------------------ tabs */

function renderTabs() {
  tabsEl.innerHTML = TABS.map((tb) => `
    <button class="tab${tb.id === currentTab ? ' on' : ''}" data-tab="${tb.id}">
      <span class="tab-sym">${tb.sym}</span>
      <span class="tab-lbl">${t(tb.key)}</span>
    </button>`).join('');
}

function goto(id, presetId) {
  if (currentTab === id && current?.selectPreset && presetId) {
    current.selectPreset(presetId);
    return;
  }
  if (currentTab === id && !presetId) return;
  const tb = TABS.find((x) => x.id === id) || TABS[0];
  current?.destroy();
  current = null;
  view.className = `view view-${tb.id}`;
  currentTab = tb.id;
  current = tb.make(view, app, presetId);
  store.set('tab', tb.id);
  renderTabs();
  closeSheet();
}

tabsEl.addEventListener('click', (e) => {
  const id = e.target.closest('[data-tab]')?.dataset.tab;
  if (id) goto(id);
});

/* ---------------------------------------------------------------- sheets */

let sheetOnClose = null;

function closeSheet() {
  sheetEl.hidden = true;
  sheetEl.innerHTML = '';
  document.body.classList.remove('sheet-open');
  sheetOnClose?.();
  sheetOnClose = null;
}

function shell(title, body) {
  sheetEl.hidden = false;
  document.body.classList.add('sheet-open');
  sheetEl.innerHTML = `
    <div class="scrim" data-close="1"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
      <header class="sheet-head">
        <span class="grip"></span>
        <h2>${title}</h2>
        <button class="sheet-x" data-close="1" aria-label="${t('ui.close')}">✕</button>
      </header>
      <div class="sheet-body">${body}</div>
    </section>`;
  return sheetEl.querySelector('.sheet-body');
}

sheetEl.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) closeSheet();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !sheetEl.hidden) closeSheet();
});

/** Field picker: preset list, optional custom formula, optional slider. */
function openSheet({ title, items, custom, slider }) {
  const list = items.map((it) => `
    <button class="opt${it.active ? ' on' : ''}" data-pick="${it.id}">
      <span class="opt-head">
        <span class="opt-name">${it.name}</span>
        ${it.active ? '<span class="opt-tick">✓</span>' : ''}
      </span>
      <span class="opt-tex tex">${tex(it.tex)}</span>
      ${it.note ? `<span class="opt-note">${it.note}</span>` : ''}
    </button>`).join('');

  const sliderHtml = slider ? `
    <div class="field">
      <label class="field-row"><span>${slider.label}</span><b id="sv">${slider.value.toFixed(2)}</b></label>
      <input type="range" id="sl" min="${slider.min}" max="${slider.max}" step="${slider.step}" value="${slider.value}">
    </div>` : '';

  const customHtml = custom ? `
    <div class="field">
      <label class="field-row"><span>${t('ui.custom')}</span></label>
      ${custom.pair ? `
        <div class="inp"><em class="tex">${tex('P =')}</em><input id="c1" value="${esc(custom.value)}" spellcheck="false" autocapitalize="off"></div>
        <div class="inp"><em class="tex">${tex('Q =')}</em><input id="c2" value="${esc(custom.value2)}" spellcheck="false" autocapitalize="off"></div>
      ` : `
        <div class="inp"><em class="tex">${tex(custom.label)}</em><input id="c1" value="${esc(custom.value)}" spellcheck="false" autocapitalize="off"></div>
      `}
      <p class="err" id="cerr" hidden></p>
      <button class="btn" id="capply">${t('ui.apply')}</button>
      <p class="hint">${t('help.syntax')}</p>
    </div>` : '';

  const body = shell(title, `<div class="opts">${list}</div>${sliderHtml}${customHtml}`);

  body.addEventListener('click', (e) => {
    const id = e.target.closest('[data-pick]')?.dataset.pick;
    if (id) {
      items.find((x) => x.id === id)?.onPick();
      closeSheet();
    }
  });

  if (slider) {
    const sl = body.querySelector('#sl');
    const sv = body.querySelector('#sv');
    sl.addEventListener('input', () => {
      const v = Number(sl.value);
      sv.textContent = v.toFixed(2);
      slider.onInput(v);
    });
  }

  if (custom) {
    const c1 = body.querySelector('#c1');
    const c2 = body.querySelector('#c2');
    const err = body.querySelector('#cerr');
    const apply = () => {
      const msg = custom.pair ? custom.onApply(c1.value, c2.value) : custom.onApply(c1.value);
      if (msg) { err.hidden = false; err.textContent = msg; }
      else closeSheet();
    };
    body.querySelector('#capply').addEventListener('click', apply);
    [c1, c2].forEach((el) => el?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') apply();
    }));
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* -------------------------------------------------------------- settings */

function openSettings() {
  const chips = COLORMAPS.map((cm) => {
    const stops = Array.from({ length: 9 }, (_, i) => `${cssColor(cm.id, i / 8)} ${(i / 8) * 100}%`).join(',');
    return `
      <button class="cmap${cm.id === app.colormap ? ' on' : ''}" data-cmap="${cm.id}">
        <span class="cmap-strip" style="background:linear-gradient(90deg,${stops})"></span>
        <span class="cmap-name">${cm.label}</span>
        <span class="cmap-badge ${cm.safe ? 'safe' : 'warn'}">${cm.safe ? t('ui.cvdSafe') : t('ui.notCvdSafe')}</span>
      </button>`;
  }).join('');

  const body = shell(t('ui.settings'), `
    <div class="field">
      <label class="field-row"><span>${t('ui.colormap')}</span></label>
      <div class="cmaps">${chips}</div>
    </div>
    <div class="field">
      <label class="field-row"><span>${t('ui.arrows')} — ${t('ui.density')}</span><b id="dv">${app.density}</b></label>
      <input type="range" id="dn" min="8" max="20" step="1" value="${app.density}">
    </div>`);

  body.addEventListener('click', (e) => {
    const id = e.target.closest('[data-cmap]')?.dataset.cmap;
    if (!id) return;
    app.colormap = id;
    store.set('cmap', id);
    body.querySelectorAll('.cmap').forEach((el) => el.classList.toggle('on', el.dataset.cmap === id));
    current?.refresh();
  });

  const dn = body.querySelector('#dn');
  const dv = body.querySelector('#dv');
  dn.addEventListener('input', () => {
    app.density = Number(dn.value);
    dv.textContent = dn.value;
    store.set('density', dn.value);
    current?.refresh();
  });
}

/* -------------------------------------------------------------- handbook */

function openHandbook() {
  const card = (sym, name, io, def, meaning, accent) => `
    <article class="hb" style="--a:${accent}">
      <h3><span class="hb-sym tex">${tex(sym)}</span>${name}</h3>
      <div class="hb-def tex">${tex(def)}</div>
      <p class="hb-io">${io}</p>
      <p>${meaning}</p>
    </article>`;

  shell(t('ui.handbook'), `
    <p class="sheet-lead">${t('hb.title')}</p>
    ${card('\\nabla f', t('tab.gradient'), t('hb.scalarToVector'),
      '\\nabla f = \\left(\\frac{\\partial f}{\\partial x},\\ \\frac{\\partial f}{\\partial y}\\right)',
      t('hb.gradMeaning'), '#8ddf9f')}
    ${card('\\nabla\\cdot\\mathbf{F}', t('tab.divergence'), t('hb.vectorToScalar'),
      '\\nabla\\cdot\\mathbf{F} = \\frac{\\partial P}{\\partial x} + \\frac{\\partial Q}{\\partial y}',
      t('hb.divMeaning'), '#7ec8ff')}
    ${card('(\\nabla\\times\\mathbf{F})_z', t('tab.curl'), t('hb.vectorToAxial'),
      '(\\nabla\\times\\mathbf{F})_z = \\frac{\\partial Q}{\\partial x} - \\frac{\\partial P}{\\partial y}',
      t('hb.curlMeaning'), '#c08cff')}

    <p class="sheet-lead">${t('hb.theorems')}</p>
    <article class="hb thm">
      <h3>${t('hb.gaussName')}</h3>
      <div class="hb-def tex">${tex('\\oint_{\\partial A} \\mathbf{F}\\cdot\\mathbf{n}\\, ds = \\iint_A (\\nabla\\cdot\\mathbf{F})\\, dA')}</div>
    </article>
    <article class="hb thm">
      <h3>${t('hb.stokesName')}</h3>
      <div class="hb-def tex">${tex('\\oint_{\\partial A} \\mathbf{F}\\cdot d\\mathbf{r} = \\iint_A (\\nabla\\times\\mathbf{F})_z\\, dA')}</div>
    </article>

    <p class="sheet-lead">${t('hb.identities')}</p>
    <article class="hb thm">
      <div class="hb-def tex">${tex('\\nabla \\times (\\nabla f) = \\mathbf{0}')}</div>
      <p>${t('hb.idCurlGrad')}</p>
    </article>
    <article class="hb thm">
      <div class="hb-def tex">${tex('\\nabla \\cdot (\\nabla \\times \\mathbf{F}) = 0')}</div>
      <p>${t('hb.idDivCurl')}</p>
    </article>

    <p class="sheet-lead">${t('hb.physics')}</p>
    <article class="hb thm">
      <div class="hb-def tex">${tex('\\mathbf{E} = -\\nabla V, \\quad \\nabla\\cdot\\mathbf{E} = \\rho/\\varepsilon_0, \\quad \\nabla\\times\\mathbf{E} = -\\frac{\\partial \\mathbf{B}}{\\partial t}')}</div>
    </article>`);
}

/* ------------------------------------------------------------------ init */

function syncShellText() {
  langBtn.textContent = t('ui.language');
  bookBtn.title = t('ui.handbook');
  gearBtn.title = t('ui.settings');
  document.getElementById('tagline').textContent = t('app.tagline');
  renderTabs();
}

langBtn.addEventListener('click', () => {
  setLang(getLang() === 'en' ? 'ja' : 'en');
  syncShellText();
  current?.relang();
  if (!sheetEl.hidden) closeSheet();
});
bookBtn.addEventListener('click', openHandbook);
gearBtn.addEventListener('click', openSettings);

initLang();
syncShellText();
goto(store.get('tab', 'gradient'));

// A pinch-zoom on a canvas would fight the drag handler, so damp double-tap zoom.
document.addEventListener('gesturestart', (e) => e.preventDefault());

  return {};
})();
</script>
</body>
</html>
