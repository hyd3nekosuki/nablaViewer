:root {
  --bg: #070a10;
  --panel: #111723;
  --panel-2: #19202e;
  --line: #273041;
  --tx: #e9eff8;
  --tx2: #9aa8bd;
  --tx3: #6d7b90;
  --accent: #ffd166;

  --font-ui: system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans',
             'Noto Sans JP', 'Yu Gothic UI', Meiryo, sans-serif;
  --font-tex: 'KaTeX_Main', 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
  --font-texit: 'KaTeX_Math', 'Cambria Math', 'STIX Two Math', serif;
  --font-num: 'KaTeX_Main', ui-monospace, 'SF Mono', Consolas, monospace;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --head-h: 48px;
  --tabs-h: 56px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--tx);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

/* ============================================================
   1. TeX-like typesetting
   ============================================================ */
.tex { font-family: var(--font-tex); line-height: 1.15; white-space: nowrap; letter-spacing: .01em; }
.tex i { font-family: var(--font-texit); font-style: italic; letter-spacing: .02em; }
.tex .rm { font-family: var(--font-tex); font-style: normal; }
.tex .n { font-family: var(--font-tex); font-variant-numeric: tabular-nums; }
.tex .bf { font-family: var(--font-tex); font-weight: 700; font-style: normal; }
.tex .txt { font-family: var(--font-ui); font-size: .86em; font-style: normal; }
.tex .fn { padding-right: .1em; }
.tex .op { padding: 0 .18em; }
.tex .pun { padding-right: .18em; }
.tex sub, .tex sup { font-size: .72em; line-height: 0; letter-spacing: 0; }
.tex sub { vertical-align: -.26em; }
.tex sup { vertical-align: .48em; }
.tex .frac { display: inline-block; vertical-align: -.52em; text-align: center; font-size: .82em; margin: 0 .12em; }
.tex .frac > span { display: block; padding: 0 .3em; }
.tex .frac > span:first-child { border-bottom: .06em solid currentColor; }
.tex .sqrt { border-top: .05em solid currentColor; padding: 0 .1em; margin-left: -.04em; }
.tex .ovl, .tex .vec, .tex .hat { display: inline-block; position: relative; line-height: 1; padding-top: .18em; }
.tex .ovl::before { content: ""; position: absolute; left: 2%; right: 6%; top: 0; height: .055em; background: currentColor; }
.tex .vec::before { content: "→"; position: absolute; left: 0; right: 0; top: -.55em; text-align: center; font-size: .62em; }
.tex .hat::before { content: "^"; position: absolute; left: 0; right: 0; top: -.06em; text-align: center; font-size: .88em; line-height: 1; }
.tex .delim { display: inline-block; font-size: 1.5em; line-height: .6; vertical-align: -.22em; transform: scaleX(.78); font-weight: 300; }
.tex .sp-thin { display: inline-block; width: .17em; }
.tex .sp-med { display: inline-block; width: .28em; }
.tex .sp-neg { display: inline-block; margin-left: -.1em; }
.tex .sp-quad { display: inline-block; width: .9em; }
.tex .sp-qquad { display: inline-block; width: 1.8em; }
.tex-display { display: block; text-align: center; font-size: 1.05em; overflow-x: auto; }

/* ============================================================
   2. Shell
   ============================================================ */
#app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100dvh;
}

.head {
  display: flex; align-items: center; gap: 10px;
  height: calc(var(--head-h) + var(--safe-top));
  padding: var(--safe-top) 10px 0 12px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  font-family: var(--font-tex); font-size: 17px; color: #0a0e15; font-weight: 700;
  background: linear-gradient(135deg, #8ddf9f, #7ec8ff 55%, #c08cff);
}
.brand-txt { min-width: 0; line-height: 1.15; }
.brand-name { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.brand-sub { font-size: 10.5px; color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hbtn {
  height: 32px; min-width: 32px; padding: 0 9px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2);
  color: var(--tx2); font-size: 12px; font-weight: 600;
  display: grid; place-items: center; flex: none;
}
.hbtn:active { background: #222b3c; }
.hbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.view { position: relative; overflow: hidden; min-height: 0; }

.tabs {
  display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tabs-h) + var(--safe-bot));
  padding-bottom: var(--safe-bot);
  background: var(--panel); border-top: 1px solid var(--line);
}
.tab {
  display: grid; place-items: center; gap: 1px;
  color: var(--tx3); transition: color .12s;
}
.tab-sym { font-family: var(--font-tex); font-size: 16px; line-height: 1.1; }
.tab-lbl { font-size: 10px; font-weight: 600; }
.tab.on { color: var(--tx); }
.tab.on .tab-sym { color: var(--accent); }

/* ============================================================
   3. Stage — canvas plus a thin layer of chrome
   ============================================================ */
/* --cvh is the real canvas height, set by Scene; on a tall phone the canvas
   stops short of the bottom and the readout bar fills the gap. */
.stage { position: absolute; inset: 0; --cvh: 100%; }
.cv { display: block; width: 100%; touch-action: none; }

.pill-top {
  position: absolute; top: 10px; left: 10px; max-width: calc(100% - 20px);
  display: flex; align-items: center; gap: 7px;
  padding: 7px 11px; border-radius: 11px;
  background: rgba(10,14,21,.82); border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(10px);
  font-size: 12.5px; font-weight: 600;
}
.pill-top b { font-family: var(--font-tex); font-weight: 400; color: var(--accent); font-size: 14px; }
.pill-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { width: 0; height: 0; flex: none; border: 4px solid transparent; border-top-color: var(--tx3); margin-top: 3px; }

/* Sit just under the canvas when it stops short, and overlay its foot when
   it does not — so the readout is always next to the picture, never adrift. */
.hud {
  position: absolute; left: 10px; right: 10px;
  top: min(calc(var(--cvh) + 8px), calc(100% - 52px));
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 11px;
  background: rgba(10,14,21,.84); border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(10px);
}
.hud-main { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; overflow: hidden; }
.hud-main .k { font-family: var(--font-tex); color: var(--tx2); }
.hud-main b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.hud-main .dim { color: var(--tx2); font-size: 11.5px; white-space: nowrap; }
.hud-main .sep { width: 1px; height: 12px; background: var(--line); flex: none; }
.hud-main .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.hud-more {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: rgba(255,255,255,.07); color: var(--tx2); font-size: 15px; line-height: 1;
}

.fab {
  position: absolute; right: 10px; top: 10px;
  padding: 8px 14px; border-radius: 11px;
  background: var(--accent); color: #141a24; font-size: 12.5px; font-weight: 700;
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
}
.fab.on { background: #ff9e4a; }

/* Sits directly above the readout bar, overlapping the foot of the canvas. */
.sheet-detail {
  position: absolute; left: 10px; right: 10px;
  bottom: calc(100% - var(--cvh) + 54px);
  padding: 11px 12px; border-radius: 12px;
  background: rgba(14,19,28,.95); border: 1px solid var(--line);
  backdrop-filter: blur(10px);
  max-height: 46%; overflow-y: auto;
}
/* Colour goes on the row, not on `span`: the formula's variables are <i> and
   would otherwise stay brighter than the brackets around them. */
.sd-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; padding: 3px 0; font-size: 12.5px; color: var(--tx2);
}
.sd-row b { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--tx); }
.sd-note { margin: 8px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--tx2); }
.sd-note.dim { color: var(--tx3); }

/* The two partial derivatives are set out as written arithmetic, because the
   mark joining them is the whole vector/scalar distinction: the gradient keeps
   a comma and stays a pair, while divergence adds and curl subtracts, each
   collapsing to one number that cannot point anywhere.  The operator is given
   the accent colour because it is the part worth noticing. */
/* Nothing here may select a bare `i` or `span`: tex() wraps every variable in
   <i> and every bracket and operator in <span>, so a loose selector would
   repaint the formula itself.  Hence the explicit classes. */
.calc { margin: 2px 0 10px; }
.calc-row, .calc-sum {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 0; font-size: 12.5px; color: var(--tx2);
}
.calc-op {
  flex: none; width: 11px; text-align: center;
  font-family: var(--font-tex); font-size: 15px; color: var(--accent);
}
.calc-lbl { flex: 1; min-width: 0; }
.calc-row b, .calc-sum b { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--tx); }
.calc-sum { margin-top: 3px; padding-top: 7px; border-top: 1px solid var(--tx3); color: var(--tx); }
.calc-sum b { font-weight: 700; }
.calc-sum b em { font-style: normal; font-weight: 700; color: var(--accent); padding: 0 2px; }
.calc-tag { padding-left: 19px; margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--tx3); }

/* ---- colour bar (gradient module) ---- */
.cbar {
  position: absolute; right: 8px; top: calc(var(--cvh) / 2); transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
  padding: 7px 7px 7px 8px; border-radius: 11px;
  background: rgba(10,14,21,.66); border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(8px);
  pointer-events: none;
}
/* The caption wraps rather than setting the panel's width: it has to stay
   readable (it is the answer to "what does this colour mean"), but it must
   not take a quarter of a phone screen away from the field. */
.cbar-cap {
  max-width: 54px; white-space: normal; text-align: right; line-height: 1.25;
  font-size: 9.5px; font-weight: 700; color: var(--tx2);
}
.cbar-body { position: relative; display: flex; align-items: stretch; gap: 5px; height: 34vh; max-height: 230px; min-height: 130px; }
.cbar-cv { width: 11px; height: 100%; border-radius: 3px; display: block; }
.cbar-ticks { position: relative; width: 22px; }
.cbar-ticks div {
  position: absolute; right: 0; transform: translateY(-50%);
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 9px; color: var(--tx2); white-space: nowrap;
}
.cbar-mark {
  position: absolute; left: -4px; width: 19px; height: 0;
  transform: translateY(50%); transition: bottom .08s linear;
}
.cbar-mark::before {
  content: ""; position: absolute; left: 0; top: -5px;
  border: 5px solid transparent; border-left-color: #fff;
}
.cbar-mark span {
  position: absolute; right: 100%; top: -8px; margin-right: 3px;
  padding: 1px 4px; border-radius: 4px;
  background: #fff; color: #0a0e15;
  font-family: var(--font-num); font-size: 9.5px; font-weight: 700;
}

/* ---- blob meter (divergence module) ---- */
.blobmeter {
  position: absolute; right: 10px; top: calc(var(--cvh) / 2); transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 9px 8px; border-radius: 12px;
  background: rgba(10,14,21,.8); border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(10px); pointer-events: none;
  --c: #9fb0c4;
}
.blobmeter[data-state="up"] { --c: #ff9e4a; }
.blobmeter[data-state="down"] { --c: #4aa8ff; }
.bm-label { font-size: 9.5px; color: var(--tx3); max-width: 46px; text-align: center; line-height: 1.2; }
/* The bar clips its own fill, so the ×1 marker lives on an unclipped wrapper
   around it — otherwise overflow:hidden eats the label. */
.bm-wrap { position: relative; display: flex; }
.bm-bar {
  position: relative; width: 9px; height: 26vh; max-height: 170px; min-height: 100px;
  border-radius: 5px; background: rgba(255,255,255,.08); overflow: hidden;
}
.bm-bar i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--c); transition: height .1s linear; }
/* the ×1 reference line: the area the blob started with */
.bm-wrap::after {
  content: ""; position: absolute; left: -3px; right: -3px; bottom: 50%;
  height: 1px; background: rgba(255,255,255,.55);
}
.bm-wrap u {
  position: absolute; right: calc(100% + 4px); bottom: 50%;
  transform: translateY(50%); text-decoration: none;
  padding: 1px 3px; border-radius: 3px;
  background: rgba(10,14,21,.82);
  font-family: var(--font-num); font-size: 9px; line-height: 1.3;
  color: var(--tx2); white-space: nowrap;
}
.bm-val { font-family: var(--font-num); font-size: 12px; font-weight: 700; color: var(--c); }
.bm-val::after { content: attr(data-word); display: block; font-family: var(--font-ui); font-size: 9px; font-weight: 600; color: var(--tx3); text-align: center; }

/* ============================================================
   4. Bottom sheet
   ============================================================ */
#sheet { position: fixed; inset: 0; z-index: 50; }
#sheet[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 86dvh; display: flex; flex-direction: column;
  background: var(--panel); border-radius: 18px 18px 0 0;
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-bot);
  animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translateY(18px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

.sheet-head {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 10px; border-bottom: 1px solid var(--line);
}
.grip { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 34px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet-head h2 { flex: 1; margin: 0; font-size: 14px; font-weight: 650; }
.sheet-x { width: 30px; height: 30px; border-radius: 8px; background: var(--panel-2); color: var(--tx2); font-size: 13px; }
.sheet-body { overflow-y: auto; padding: 12px 14px 20px; -webkit-overflow-scrolling: touch; }
.sheet-lead { margin: 16px 0 8px; font-size: 11px; font-weight: 700; color: var(--tx3); text-transform: uppercase; letter-spacing: .06em; }
.sheet-lead:first-child { margin-top: 0; }

.opts { display: grid; gap: 7px; }
.opt {
  display: grid; gap: 4px; text-align: left; width: 100%;
  padding: 11px 12px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--line);
}
.opt.on { border-color: var(--accent); background: #1d2231; }
.opt-head { display: flex; align-items: center; gap: 8px; }
.opt-name { flex: 1; font-size: 13px; font-weight: 650; }
.opt-tick { color: var(--accent); font-size: 12px; }
.opt-tex { font-size: 12.5px; color: #9fd9ff; overflow-x: auto; }
.opt-note { font-size: 11.5px; line-height: 1.5; color: var(--tx2); }

.field { margin-top: 16px; }
.field-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--tx2); margin-bottom: 7px; }
.field-row b { font-family: var(--font-num); color: var(--tx); }

.inp {
  display: flex; align-items: center; gap: 7px; margin-bottom: 7px;
  padding: 9px 11px; border-radius: 10px;
  background: var(--panel-2); border: 1px solid var(--line);
}
/* The label is typeset by tex(), which picks KaTeX_Math for the variables and
   KaTeX_Main for the brackets and the equals sign.  Asking for italic here
   instead would hand KaTeX_Main a style it has no face for, and the browser
   would answer with a synthesised slant or a fallback family — which is how
   this one label ended up in a different typeface from every other formula. */
.inp em { flex: none; font-size: 13px; color: var(--accent); font-style: normal; }
.inp input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-family: var(--font-num); font-size: 13px; }

.btn {
  padding: 10px 16px; border-radius: 10px;
  background: var(--accent); color: #141a24; font-size: 13px; font-weight: 700;
}
.btn.ghost { background: var(--panel-2); color: var(--tx2); border: 1px solid var(--line); }
.err { margin: 4px 0 8px; font-size: 11.5px; color: #ff8b8b; }
.hint { margin: 9px 0 0; font-size: 11px; line-height: 1.5; color: var(--tx3); }

input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 26px; background: none;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; margin-top: -8px;
  width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 0;
}
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 0; }

.cmaps { display: grid; gap: 7px; }
.cmap {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: 11px;
  background: var(--panel-2); border: 1px solid var(--line); text-align: left;
}
.cmap.on { border-color: var(--accent); }
.cmap-strip { display: block; width: 56px; height: 14px; border-radius: 4px; }
.cmap-name { font-size: 13px; font-weight: 650; }
.cmap-badge { font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 20px; white-space: nowrap; }
.cmap-badge.safe { background: rgba(126,200,255,.14); color: #8fcdff; }
.cmap-badge.warn { background: rgba(255,158,74,.16); color: #ffb673; }

.hb { padding: 12px 13px; border-radius: 13px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--a, var(--line)); margin-bottom: 8px; }
.hb h3 { margin: 0 0 8px; font-size: 13px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.hb-sym { color: var(--a, var(--tx)); font-size: 15px; }
.hb-def { margin: 6px 0 8px; padding: 9px 6px; border-radius: 8px; background: rgba(0,0,0,.28); text-align: center; font-size: 12.5px; overflow-x: auto; color: #cfe4ff; }
.hb-io { margin: 0 0 6px; font-size: 10.5px; font-weight: 700; color: var(--tx3); text-transform: uppercase; letter-spacing: .04em; }
.hb p { margin: 0; font-size: 12px; line-height: 1.6; color: var(--tx2); }
.hb.thm { border-left-color: var(--line); }

/* ============================================================
   5. Quiz
   ============================================================ */
.quiz { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.quiz-inner { max-width: 720px; margin: 0 auto; padding: 12px 12px 28px; }

.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.quiz-prog { display: flex; align-items: center; gap: 9px; min-width: 0; }
.quiz-step { font-family: var(--font-num); font-size: 11.5px; color: var(--tx3); flex: none; }
.quiz-dots { display: flex; gap: 4px; flex-wrap: wrap; }
.quiz-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); cursor: pointer; }
.quiz-dots i.ok { background: #8ddf9f; }
.quiz-dots i.no { background: #ff8b8b; }
.quiz-dots i.cur { outline: 2px solid var(--accent); outline-offset: 2px; }
.quiz-score { font-size: 11.5px; color: var(--tx2); flex: none; }
.quiz-score b { font-family: var(--font-num); color: var(--tx); font-size: 13px; }

.quiz-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.quiz-prompt { padding: 11px 8px; margin-bottom: 12px; border-radius: 10px; background: rgba(0,0,0,.3); text-align: center; font-size: 13.5px; color: #cfe4ff; overflow-x: auto; }
.quiz-q { margin: 0 0 13px; font-size: 13.5px; line-height: 1.65; }

.quiz-opts { display: grid; gap: 8px; }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 10px; text-align: left;
  padding: 12px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--line);
  font-size: 12.5px; line-height: 1.55;
}
.quiz-letter {
  flex: none; width: 20px; height: 20px; border-radius: 6px;
  display: grid; place-items: center;
  background: rgba(255,255,255,.07); color: var(--tx3);
  font-family: var(--font-num); font-size: 11px; font-weight: 700;
}
.quiz-opt.ok { border-color: #8ddf9f; background: rgba(141,223,159,.12); }
.quiz-opt.ok .quiz-letter { background: #8ddf9f; color: #0a0e15; }
.quiz-opt.no { border-color: #ff8b8b; background: rgba(255,139,139,.12); }
.quiz-opt.no .quiz-letter { background: #ff8b8b; color: #0a0e15; }
.quiz-opt.dim { opacity: .42; }
.quiz-opt:disabled { cursor: default; }

.quiz-why { margin-top: 14px; padding: 13px; border-radius: 12px; background: rgba(0,0,0,.3); border: 1px solid var(--line); }
.quiz-verdict { font-size: 12.5px; font-weight: 700; margin-bottom: 7px; }
.quiz-why.ok .quiz-verdict { color: #8ddf9f; }
.quiz-why.no .quiz-verdict { color: #ff8b8b; }
.quiz-why p { margin: 0 0 11px; font-size: 12.5px; line-height: 1.7; color: var(--tx2); }
.quiz-math { padding: 9px 6px; border-radius: 9px; background: rgba(255,255,255,.04); text-align: center; font-size: 12.5px; color: #cfe4ff; overflow-x: auto; }
.quiz-math + .quiz-math { margin-top: 5px; }
.quiz-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }

/* ============================================================
   6. Wider screens — more room, same hierarchy
   ============================================================ */
@media (min-width: 560px) {
  :root { --head-h: 54px; --tabs-h: 60px; }
  .brand-name { font-size: 15px; }
  .hud { left: 14px; right: auto; min-width: 320px; max-width: 64%; }
  .pill-top, .fab { top: 14px; }
  .pill-top { left: 14px; }
  .fab { right: 14px; }
  .cbar, .blobmeter { right: 14px; }
  .sheet { left: 50%; right: auto; transform: translateX(-50%); width: min(560px, 100%); border-radius: 18px 18px 0 0; }
  .quiz-inner { padding: 20px 20px 36px; }
  .quiz-q { font-size: 14.5px; }
}

@media (max-width: 359px) {
  .hide-xs { display: none !important; }
  .tab-lbl { font-size: 9px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>

<div id="app">
  <header class="head">
    <div class="brand">

NV.field = (function () {
/* nablaViewer — field.js
 * Safe expression compiler + numerical vector calculus.
 *
 * The user-supplied formula is tokenised, parsed into an AST and then
 * re-emitted as JavaScript source.  Nothing from the input string ever
 * reaches `new Function` verbatim, so arbitrary code cannot slip through,
 * while the compiled closure stays as fast as hand-written JS.
 */

/* ---------------------------------------------------------------- tokenizer */

const FUNCS = {
  sin: 'Math.sin', cos: 'Math.cos', tan: 'Math.tan',
  asin: 'Math.asin', acos: 'Math.acos', atan: 'Math.atan',
  sinh: 'Math.sinh', cosh: 'Math.cosh', tanh: 'Math.tanh',
  exp: 'Math.exp', log: 'Math.log', ln: 'Math.log', log10: 'Math.log10',
  sqrt: 'Math.sqrt', abs: 'Math.abs', sign: 'Math.sign',
  floor: 'Math.floor', ceil: 'Math.ceil', round: 'Math.round',
  min: 'Math.min', max: 'Math.max', atan2: 'Math.atan2', pow: 'Math.pow',
};

const CONSTS = { pi: 'Math.PI', e: 'Math.E' };
const VARS = { x: 'x', y: 'y', r: 'Math.sqrt(x*x+y*y)', t: 't' };

function tokenize(src) {
  // Whitespace is skipped token by token, not stripped up front: stripping it
  // would glue "x y" into the unknown symbol "xy" instead of leaving two names
  // for the implicit-multiplication pass.
  const s = String(src).toLowerCase();
  const out = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.]/.test(c)) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      const text = s.slice(i, j);
      if (!/^\d*\.?\d+$/.test(text)) throw new Error(`Bad number "${text}"`);
      out.push({ t: 'num', v: text });
      i = j;
    } else if (/[a-z]/.test(c)) {
      let j = i;
      while (j < s.length && /[a-z0-9]/.test(s[j])) j++;
      out.push({ t: 'name', v: s.slice(i, j) });
      i = j;
    } else if ('+-*/^(),'.includes(c)) {
      out.push({ t: c });
      i++;
    } else {
      throw new Error(`Unexpected character "${c}"`);
    }
  }
  return out;
}

/* Insert the implicit multiplications students expect: 2x, 3sin(x), (x+1)(y-1),
 * x y, 2(x+1).  Done on the token stream, never by rewriting the raw string. */
function insertImplicitMul(tok) {
  const out = [];
  for (let i = 0; i < tok.length; i++) {
    if (i > 0) {
      const a = tok[i - 1], b = tok[i];
      const aEnds = a.t === 'num' || a.t === 'name' || a.t === ')';
      const bStarts = b.t === 'num' || b.t === 'name' || b.t === '(';
      // "sin(" must not become "sin*(", so a name directly followed by "(" is a call.
      const aIsFuncName = a.t === 'name' && Object.hasOwn(FUNCS, a.v);
      if (aEnds && bStarts && !(aIsFuncName && b.t === '(')) out.push({ t: '*' });
    }
    out.push(tok[i]);
  }
  return out;
}

/* ------------------------------------------------------------------ parser */
/* expr := term (("+"|"-") term)*
 * term := unary (("*"|"/") unary)*
 * unary := ("-"|"+") unary | power
 * power := atom ("^" unary)?        -- right associative, binds tighter than unary minus
 * atom := num | const | var | func "(" args ")" | "(" expr ")"
 */

function parse(tokens) {
  let p = 0;
  const peek = () => tokens[p];
  const eat = (t) => {
    if (!tokens[p] || tokens[p].t !== t) throw new Error(`Expected "${t}"`);
    return tokens[p++];
  };

  function expr() {
    let node = term();
    while (peek() && (peek().t === '+' || peek().t === '-')) {
      const op = tokens[p++].t;
      node = { k: 'bin', op, a: node, b: term() };
    }
    return node;
  }
  function term() {
    let node = unary();
    while (peek() && (peek().t === '*' || peek().t === '/')) {
      const op = tokens[p++].t;
      node = { k: 'bin', op, a: node, b: unary() };
    }
    return node;
  }
  function unary() {
    if (peek() && (peek().t === '-' || peek().t === '+')) {
      const op = tokens[p++].t;
      const v = unary();
      return op === '-' ? { k: 'neg', a: v } : v;
    }
    return power();
  }
  function power() {
    const base = atom();
    if (peek() && peek().t === '^') {
      p++;
      return { k: 'bin', op: '^', a: base, b: unary() };
    }
    return base;
  }
  function atom() {
    const tk = peek();
    if (!tk) throw new Error('Unexpected end of formula');
    if (tk.t === 'num') { p++; return { k: 'num', v: tk.v }; }
    if (tk.t === '(') { p++; const v = expr(); eat(')'); return v; }
    if (tk.t === 'name') {
      p++;
      const name = tk.v;
      if (peek() && peek().t === '(') {
        if (!Object.hasOwn(FUNCS, name)) throw new Error(`Unknown function "${name}"`);
        p++;
        const args = [];
        if (peek() && peek().t !== ')') {
          args.push(expr());
          while (peek() && peek().t === ',') { p++; args.push(expr()); }
        }
        eat(')');
        return { k: 'call', name, args };
      }
      if (Object.hasOwn(VARS, name)) return { k: 'var', v: name };
      if (Object.hasOwn(CONSTS, name)) return { k: 'const', v: name };
      throw new Error(`Unknown symbol "${name}"`);
    }
    throw new Error(`Unexpected token "${tk.t}"`);
  }

  const root = expr();
  if (p !== tokens.length) throw new Error('Trailing characters in formula');
  return root;
}

/* --------------------------------------------------------------- generator */

function emit(node) {
  switch (node.k) {
    case 'num': return `(${Number(node.v)})`;
    case 'var': return `(${VARS[node.v]})`;
    case 'const': return `(${CONSTS[node.v]})`;
    case 'neg': return `(-${emit(node.a)})`;
    case 'call': return `${FUNCS[node.name]}(${node.args.map(emit).join(',')})`;
    case 'bin': {
      const a = emit(node.a), b = emit(node.b);
      if (node.op === '^') return `Math.pow(${a},${b})`;
      return `(${a}${node.op}${b})`;
    }
    default: throw new Error('Internal: bad node');
  }
}

/**
 * Compile a formula in x, y (and r = sqrt(x^2+y^2), t = time) into (x, y, t) => number.
 * Throws on malformed input so callers can surface the message.
 */
function compile(src) {
  if (!src || !String(src).trim()) return () => 0;
  const js = emit(parse(insertImplicitMul(tokenize(src))));
  // eslint-disable-next-line no-new-func
  const raw = new Function('x', 'y', 't', `"use strict";return ${js};`);
  const probe = raw(0.37, -0.52, 0);
  if (typeof probe !== 'number') throw new Error('Formula did not produce a number');
  return (x, y, t) => {
    const v = raw(x, y, t || 0);
    return Number.isFinite(v) ? v : 0;
  };
}

/** Compile without throwing: returns { fn, error }. */
function tryCompile(src) {
  try {
    return { fn: compile(src), error: null };
  } catch (e) {
    return { fn: () => 0, error: e.message || 'Invalid formula' };
  }
}

/* ------------------------------------------------- numerical differentiation */

const H = 1e-4;          // central-difference step
const INV_2H = 1 / (2 * H);

/** ∇f = (∂f/∂x, ∂f/∂y) by central differences. */
function gradient(f, x, y) {
  const fx = (f(x + H, y) - f(x - H, y)) * INV_2H;
  const fy = (f(x, y + H) - f(x, y - H)) * INV_2H;
  return { fx, fy, mag: Math.hypot(fx, fy), angle: Math.atan2(fy, fx) };
}

/** ∇·F = ∂P/∂x + ∂Q/∂y. */
function divergence(P, Q, x, y) {
  const dPdx = (P(x + H, y) - P(x - H, y)) * INV_2H;
  const dQdy = (Q(x, y + H) - Q(x, y - H)) * INV_2H;
  return { div: dPdx + dQdy, dPdx, dQdy };
}

/** (∇×F)_z = ∂Q/∂x − ∂P/∂y. */
function curl(P, Q, x, y) {
  const dQdx = (Q(x + H, y) - Q(x - H, y)) * INV_2H;
  const dPdy = (P(x, y + H) - P(x, y - H)) * INV_2H;
  return { curl: dQdx - dPdy, dQdx, dPdy };
}

/** Outward flux ∮F·n ds around a circle of radius R — Gauss's theorem in 2D. */
function fluxAroundCircle(P, Q, cx, cy, R, samples = 64) {
  const ds = (2 * Math.PI * R) / samples;
  let total = 0;
  for (let i = 0; i < samples; i++) {
    const th = ((i + 0.5) / samples) * 2 * Math.PI;
    const nx = Math.cos(th), ny = Math.sin(th);
    total += (P(cx + R * nx, cy + R * ny) * nx + Q(cx + R * nx, cy + R * ny) * ny) * ds;
  }
  return total;
}

/** Circulation ∮F·dr counter-clockwise around a circle — Green's theorem in 2D. */
function circulationAroundCircle(P, Q, cx, cy, R, samples = 64) {
  const ds = (2 * Math.PI * R) / samples;
  let total = 0;
  for (let i = 0; i < samples; i++) {
    const th = ((i + 0.5) / samples) * 2 * Math.PI;
    const px = cx + R * Math.cos(th), py = cy + R * Math.sin(th);
    const tx = -Math.sin(th), ty = Math.cos(th);
    total += (P(px, py) * tx + Q(px, py) * ty) * ds;
  }
  return total;
}

 * Scan f over a rectangle and return a robust [lo, hi] for the colour scale.
 * Percentile clipping keeps one singular spike from flattening everything else;
 * the result depends only on the formula and the window, never on the probe.
 */
function fieldRange(f, xMin, xMax, yMin, yMax, n = 48) {
  const vals = new Float64Array(n * n);
  let k = 0;
  for (let j = 0; j < n; j++) {
    const y = yMin + ((yMax - yMin) * j) / (n - 1);
    for (let i = 0; i < n; i++) {
      const x = xMin + ((xMax - xMin) * i) / (n - 1);
      const v = f(x, y, 0);
      vals[k++] = Number.isFinite(v) ? v : 0;
    }
  }
  vals.sort();
  const lo = vals[Math.floor(vals.length * 0.01)];
  const hi = vals[Math.floor(vals.length * 0.99)];
  if (!(hi > lo)) return [lo - 1, lo + 1];
  return [lo, hi];
}

  const raw = span / target;

  const norm = raw / mag;
  let step;
  if (norm < 1.5) step = 1;
  else if (norm < 3) step = 2;
  else if (norm < 7) step = 5;
  else step = 10;
  return step * mag;
}

  return { compile, tryCompile, gradient, divergence, curl, fluxAroundCircle, circulationAroundCircle, fieldRange, niceStep };
})();
